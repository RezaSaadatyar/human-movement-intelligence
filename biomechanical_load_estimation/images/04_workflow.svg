<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="515" viewBox="0 0 1700 515" role="img" aria-labelledby="title desc">
<title id="title">MATLAB-native conversion and biomechanical signal validation</title>
<desc id="desc">Original Essex Figshare version 13 data: 40 source participants and 1,897 records in six movement activities. 1,729 FE fields are structurally unresolved and 168 are empty. The initial Python audit verified the original source, while MATLAB-native export is awaiting delivery. Zero numerical IMU or strain payloads were validated. Units, temporal alignment and regression readiness remain unverified. This is a source-data quality pipeline, not a model result.</desc>
