<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
  <title id="title">IMU and FE timebase and numerical alignment audit</title>
  <desc id="desc">A source-linked Python analysis workflow for the original Essex Figshare v13 collection of forty participant files and 1897 movement records. Prior numerical findings include 42 original IMU signal channels and two FE target columns e1 and e3 plus separate time fields. The current notebook audits all source records and compares 11 FE time positions with every tenth of 101 IMU time positions when recoverable. The numerical conversion and machine-learning gates are not pre-declared successful.</desc>
