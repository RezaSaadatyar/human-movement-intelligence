<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
  <title id="title">PYTHON-FIRST MATLAB OBJECT DECODING AND SIGNAL FEASIBILITY</title>
  <desc id="desc">Original Essex v13 Python mat-io audit: 28 matched source record identities, 28 IMU tables each containing timestep and 42 original-labelled numeric channels, 27 FE tables containing timestep and finite numeric e1 and e3 columns, and one empty FE object. Source time indices and physical correspondence remain unverified. The strict full numerical export was blocked, and no predictive model was trained.</desc>
