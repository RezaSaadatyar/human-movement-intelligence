<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="490" viewBox="0 0 1700 490" role="img" aria-labelledby="title desc">
<title id="title">Original Essex Python-based MATLAB object decoding audit</title>
<desc id="desc">The original dataset comprises 40 participants and 1897 records. Python mat-io successfully matched 28 original trial identities and recovered 28 IMU DataFrames sized 101 by 43, 27 FE DataFrames sized 11 by 3, plus one canonical empty FE source. No reader errors occurred. Original table column meanings and source time axes are pending validation, so the full numeric export is blocked and no predictive model was trained.</desc>
