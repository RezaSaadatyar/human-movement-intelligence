<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="816" viewBox="0 0 1700 816" role="img" aria-labelledby="title desc">
<title id="title">Original MATLAB Object Decoding and Numerical Signal Recovery</title>
<desc id="desc">Consolidated source-linked Essex MATLAB numerical decoding study: original versioned registry, bounded SciPy object inspection, optional MATLAB-native conversion, pinned mat-io reader, original column and time metadata, strict export criteria and quality gate. Bounded pilot found 28 numeric IMU but no strictly verified numeric FE; later full-cohort audit is separate evidence.</desc>
