istics</text><text x="1350" y="200">No model fitting</text></g><rect x="38" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="142" y="310" text-anchor="middle" font-size="12.5" fill="#DBF2EF" font-weight="700">INPUT</text><text x="142" y="336" text-anchor="middle" font-size="14.4" fill="#FFFFFF" font-weight="700">Source Evidence</text><text x="142" y="358" text-anchor="middle" font-size="11.7" fill="#DBF2EF">Official source + hashes</text><text x="142" y="378" text-anchor="middle" font-size="11.7" fill="#DBF2EF">Earlier 01–03 gates</text><text x="142" y="398" text-anchor="middle" font-size="11.7" fill="#DBF2EF">Original time mapping</text><path d="M252 353 H266" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="274" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="378" y="310" text-anchor="middle" font-size="12.5" fill="#506C7E" font-weight="700">01</text><text x="378" y="336" text-anchor="middle" font-size="14.4" fill="#173453" font-weight="700">Pair Signals</text><text x="378" y="358" text-anchor="middle" font-size="11.7" fill="#506C7E">101×42 original IMU</text><text x="378" y="378" text-anchor="middle" font-size="11.7" fill="#506C7E">11×42 at FE coordinates</text><text x="378" y="398" text-anchor="middle" font-size="11.7" fill="#506C7E">11×2 original targets</text><path d="M488 353 H502" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="510" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="614" y="310" text-anchor="middle" font-size="12.5" fill="#506C7E" font-weight="700">02</text><text x="614" y="336" text-anchor="middle" font-size="14.4" fill="#173453" font-weight="700">Exclude Missing</text><text x="614" y="358" text-anchor="middle" font-size="11.7" fill="#506C7E">168 FE-empty trials</text><text x="614" y="378" text-anchor="middle" font-size="11.7" fill="#506C7E">Preserve original labels</text><text x="614" y="398" text-anchor="middle" font-size="11.7" fill="#506C7E">No fabricated targets</text><path d="M724 353 H738" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="746" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="850" y="310" text-anchor="middle" font-size="12.5" fill="#506C7E" font-weight="700">03</text><text x="850" y="336" text-anchor="middle" font-size="14.4" fill="#173453" font-weight="700">Split Subjects</text><text x="850" y="358" text-anchor="middle" font-size="11.7" fill="#506C7E">37 eligible people</text><text x="850" y="378" text-anchor="middle" font-size="11.7" fill="#506C7E">29 train / 4 val / 4 test</text><text x="850" y="398" text-anchor="middle" font-size="11.7" fill="#506C7E">No shared subjects</text><path d="M960 353 H974" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="982" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="1086" y="310" text-anchor="middle" font-size="12.5" fill="#506C7E" font-weight="700">04</text><text x="1086" y="336" text-anchor="middle" font-size="14.4" fill="#173453" font-weight="700">Train Statistics</text><text x="1086" y="358" text-anchor="middle" font-size="11.7" fill="#506C7E">42 channel means/std</text><text x="1086" y="378" text-anchor="middle" font-size="11.7" fill="#506C7E">Training subjects only</text><text x="1086" y="398" text-anchor="middle" font-size="11.7" fill="#506C7E">No early scaling</text><path d="M1196 353 H1210" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="1218" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="1322" y="310" text-anchor="middle" font-size="12.5" fill="#506C7E" font-weight="700">05</text><text x="1322" y="336" text-anchor="middle" font-size="14.4" fill="#173453" font-weight="700">Save Evidence</text><text x="1322" y="358" text-anchor="middle" font-size="11.7" fill="#506C7E">Flat output CSV / JSON</text><text x="1322" y="378" text-anchor="middle" font-size="11.7" fill="#506C7E">Ignored local NPZ</text><text x="1322" y="398" text-anchor="middle" font-size="11.7" fill="#506C7E">Rebuildable provenance</text><path d="M1432 353 H1446" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arr)"/><rect x="1454" y="287" width="208" height="132" rx="15" fill="#176363" stroke="#176363" stroke-width="1.8"/><text x="1558" y="310" text-anchor="middle" font-size="12.5" fill="#DBF2EF" font-weight="700">OUTPUT</text><text x="1558" y="336" text-anchor="middle" font-size="14.4" fill="#FFFFFF" font-weight="700">Quality Gate</text><text x="1558" y="358" text-anchor="middle" font-size="11.7" fill="#DBF2EF">Scientific checks</text><text x="1558" y="378" text-anchor="middle" font-size="11.7" fill="#DBF2EF">14 research outputs</text><text x="1558" y="398" text-anchor="middle" font-size="11.7" fill="#DBF2EF">No model training</text><text x="30" y="466" font-size="13.3" fill="#54738A">Original source → native-time numerical pairs → missing-target exclusions → disjoint participant split → training statistics → audited outputs</text></g></svg>
