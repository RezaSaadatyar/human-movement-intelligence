<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc"><title id="title">Governed IMU-FE Dataset and Participant Splits</title><desc id="desc">Source original Essex dataset with 40 participants, 1897 original trials, 1729 time-aligned numerical FE pairs, 168 source FE-empty exclusions and participant-disjoint 29 training 4 validation 4 test split among 37 eligible participants. No model training.</desc><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs><rect width="1700" height="480" rx="20" fill="#F4F9FD"/><g font-family="DejaVu Sans, Arial, sans-serif"><text x="30" y="38" font-size="23" font-weight="700" fill="#173453">GOVERNED IMU–FE DATASET AND PARTICIPANT SPLITS</text><text x="30" y="67" font-size="15" fill="#54738A">Verified original Essex dataset · Native FE time pairing · Leakage-free participant partition · No model training</text><rect x="24" y="84" width="1652" height="160" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/><rect x="24" y="262" width="1652" height="174" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
