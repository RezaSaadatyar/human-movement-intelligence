<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="515" viewBox="0 0 1700 515" role="img" aria-labelledby="title desc">
<title id="title">Essex source records and trial provenance audit</title>
<desc id="desc">Executed original Essex Figshare version 13 audit with 40 participant IDs matched, 1897 Data records, 1897 readable UpdatedTrialIDs, and zero duplicate participant-trial identifiers. IMU fields remain structured or opaque for all 1897 records; FE strain fields are structured or opaque for 1729 and empty for 168. Source registry quality gate passed, while numerical target decoding and model readiness remain unestablished.</desc>
