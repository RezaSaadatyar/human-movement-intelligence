<title id="title">Essex femoral neck loading - Stage 01 data foundation and provenance audit</title>
<desc id="desc">Verified original Figshare v13 source. Forty participant MAT files with 1,897 Data records. Forty source workbook IDs matched. FE target fields: 168 empty and 1,729 unresolved MATLAB objects. Source-structure quality gate passed, while numerical strain decoding and regression readiness remain blocked. The workflow covers source verification, ZIP integrity, participant inventory, FE audit, workbook reconciliation and source provenance exports.</desc>
