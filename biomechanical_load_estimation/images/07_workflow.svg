        <text x="466" y="125">PREVIOUS NUMERIC AUDIT</text>
        <text x="878" y="125">TEMPORAL MAPPING TEST</text>
        <text x="1290" y="125">SCIENTIFIC QUALITY GATE</text>
      </g>
      <g font-size="15.2" fill="#45677E">
        <text x="54" y="158">Figshare 30225739 · version 13</text>
        <text x="54" y="182">40 original participants</text>
        <text x="54" y="207">1,897 movement records</text>
        <text x="466" y="158">42 finite IMU channels</text>
