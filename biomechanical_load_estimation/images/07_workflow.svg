<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
  <title id="title">Original FE time-coordinate mapping and missing-field reconciliation</title>
  <desc id="desc">The original Essex study contains 40 participant files, 1897 movement records and 168 registry-declared empty FE fields. The preceding full-source Python audit verified 42 numeric IMU channels in every record and numeric e1 and e3 in 1729 records, but its fixed every-tenth-index time comparison failed. This research workflow tests unique matches between actual original FE and IMU time coordinates and independently classifies all empty FE source objects. No model training or full numeric export has been completed.</desc>
  <defs>
    <marker id="final-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#377396"/>
    </marker>
  </defs>
  <rect width="1700" height="480" rx="20" fill="#F4F9FD"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="36" y="42" font-size="27" font-weight="700" fill="#173453">ORIGINAL FE TIME COORDINATES AND MISSINGNESS AUDIT</text>
    <text x="36" y="72" font-size="16.2" fill="#55758A">Original Essex source · original time-value matching · verified trial identifiers</text>

    <g aria-label="Recorded evidence source groups">
      <rect x="36" y="96" width="394" height="145" rx="14" fill="#E5F1FA" stroke="#B9D4E4" stroke-width="2"/>
