<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">Original Dataset Audit and Trial Registry | Essex Biomechanical Loading</title>
<desc id="desc">Original Essex movement dataset, seven wearable lower-body IMUs at the pelvis, bilateral thighs, shanks, and feet, and original FE-related fields. Research workflow for Figshare version 13 dataset integrity, 40 participant files, 1897 movement record identifiers, source-level FE representation, workbook reconciliation, and the saved provenance quality gate. No predictive model training.</desc>
