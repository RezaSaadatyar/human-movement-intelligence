<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="500" viewBox="0 0 1700 500" role="img" aria-labelledby="title desc">
 <title id="title">Original Essex Dataset | Source Integrity and Trial Provenance</title>
 <desc id="desc">Research workflow integrating the original Essex Figshare version 13 source audit and trial provenance: 40 verified participant files, 1897 movement records with readable original trial IDs, 1729 opaque or structured FE fields, 168 source-empty FE fields, and historical source and trial quality checks. New consolidated notebook execution must be independently verified. No regression model was trained in these source-level steps.</desc>
