<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="study-title study-desc">
<title id="study-title">FINAL RESEARCH EVIDENCE | ONE-TIME ESSEX TEST AUDIT</title>
<desc id="study-desc">Source-linked final research evidence audit, not a new model experiment. Prior quality gates, fixed 29 4 4 participant groups, Random Forest selection based on Training only, Stage 07 75 fits and a pre-Test frozen protocol. One authorised Test evaluation on four new people and 183 trials recorded 8052 trial target position model predictions, MAE RF 0.0009384 TCN 0.0008759, mixed peak outcomes and final gate PASSED. No independent external or clinical validation.</desc>
