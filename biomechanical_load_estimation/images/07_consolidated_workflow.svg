<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">Stage 07 | Multi-seed robustness, GRU and BiGRU, peak-loss ablation</title>
<desc id="desc">Unexecuted Stage 07 proposal grounded in seven original lower-body IMUs and 42 channels. Frozen Essex Training-only participant-disjoint five-fold comparison of Temporal CNN, Dilated TCN, GRU, Bidirectional GRU and one peak-loss ablation, with three predeclared seeds yielding 75 fit jobs. Includes fold-mean sensor replacement and noise diagnostics, participant-level analysis and a fixed classical Random Forest reference. Validation and Test remain outside new model fitting or ranking. No performance outcome is asserted.</desc>
