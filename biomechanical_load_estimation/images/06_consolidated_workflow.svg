<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">Stage 06 | Deep temporal regression and peak prediction from source-verified Essex IMUs</title>
<desc id="desc">Completed Stage 06: seven wearable IMUs, 42 channels and 101 original samples predict e1 and e3 on eleven original FE coordinates. Training-only grouped CV selected Dilated TCN with subject-balanced MAE 0.0008513; its four-participant Validation MAE was 0.0007151. Stage 05 Random Forest retains lower overall waveform MAE, whereas Dilated TCN has lower peak-magnitude MAE for both e1 and e3. Four Test participants are untouched. All 14 Stage 06 outputs and the PASSED quality gate are recorded; this is not external validation.</desc>
