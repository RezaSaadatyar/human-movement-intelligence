<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">BoneNet exploratory biomechanical load estimation source and baseline audit</title>
<desc id="desc">Exploratory BoneNet derivative-data research diagram. Observed numerical tensors contain 444 records with 42 input channels and 101 time points, and e1/e3 model-derived target arrays. A subject-held-out pilot Ridge and training-mean comparison was executed under an unverified row-to-subject association. This is not full Figshare study replication, clinically validated estimation or established independent generalisation.</desc>
<defs><marker id="small-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs>
<rect width="1700" height="480" rx="20" fill="#F4F9FD"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="30" y="38" font-size="23" fill="#173453" font-weight="700">BIOMECHANICAL LOAD ESTIMATION | BONENET EXPLORATORY AUDIT</text>
<text x="30" y="67" font-size="15" fill="#54738A">Public derivative inspection · preliminary regression · source-to-label linkage not independently verified</text>
<rect x="24" y="84" width="1652" height="160" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<rect x="24" y="262" width="1652" height="174" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<g aria-label="Four study context panels"><g aria-label="DERIVATIVE DATASET"><text x="50" y="115" font-size="15" fill="#173453" font-weight="700">DERIVATIVE DATASET</text><text x="50" y="145" font-size="13" fill="#506C7E">BoneNet public walking / running</text><text x="50" y="167" font-size="13" fill="#506C7E">444 records · 37 label subjects</text><text x="50" y="189" font-size="13" fill="#506C7E">Not the full 40-person archive</text><text x="50" y="229" font-size="11.5" fill="#54738A">Source revision and rights apply</text></g>
<g aria-label="NUMERIC ARRAY AUDIT"><text x="380" y="115" font-size="15" fill="#173453" font-weight="700">NUMERIC ARRAY AUDIT</text><text x="380" y="145" font-size="13" fill="#506C7E">Input: 444 x 42 x 101</text><text x="380" y="167" font-size="13" fill="#506C7E">Target: 444 x 101 x 2</text><text x="380" y="189" font-size="13" fill="#506C7E">e1 / e3 model-derived strain</text><text x="380" y="229" font-size="11.5" fill="#54738A">Target units still require verification</text></g>
<g aria-label="GROUPED PILOT"><text x="742" y="115" font-size="15" fill="#173453" font-weight="700">GROUPED PILOT</text><text x="742" y="145" font-size="13" fill="#506C7E">Train: 27 subjects, 324 rows</text><text x="742" y="167" font-size="13" fill="#506C7E">Held out: 10 subjects, 120 rows</text><text x="742" y="189" font-size="13" fill="#506C7E">Training mean and Ridge baselines</text><text x="742" y="229" font-size="11.5" fill="#54738A">Row-to-subject mapping assumed</text></g>
<g aria-label="EVIDENCE LIMITATIONS"><text x="1110" y="115" font-size="15" fill="#173453" font-weight="700">EVIDENCE LIMITATIONS</text><text x="1110" y="145" font-size="13" fill="#506C7E">222 repeated CSV composite keys</text><text x="1110" y="167" font-size="13" fill="#506C7E">Unverified source row linkage</text><text x="1110" y="189" font-size="13" fill="#506C7E">Pooled error across targets</text><text x="1110" y="229" font-size="11.5" fill="#54738A">No validated generalisation claims</text></g></g>
<g aria-label="Six horizontal scientific workflow arrows"><path d="M252 353 H266" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M488 353 H502" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M724 353 H738" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M960 353 H974" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M1196 353 H1210" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M1432 353 H1446" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/></g>
