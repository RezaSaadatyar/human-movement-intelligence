<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc"><title id="title">Full-Cohort Numeric and Temporal Validation</title><desc id="desc">Original seven wearable IMU locations and femoral neck FE signal audit for 40 participants, 1897 records. Fixed every-tenth-sample assumption differs for 1729 records, while direct matching of original source coordinates yields 1729 mappings, with 168 separate source-empty FE records. No model fitting or unit verification.</desc>
