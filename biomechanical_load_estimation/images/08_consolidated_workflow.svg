<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">Stage 08 | Frozen primary Random Forest, descriptive Dilated TCN and one-time same-source Test</title>
<desc id="desc">Completed Stage 08 final same-source participant-held-out assessment: seven lower-body IMUs, 42 channels, 101 original IMU samples and eleven native FE positions for unitless e1 and e3 FE-model targets. A before-Test-frozen Random Forest primary and descriptive Dilated TCN secondary were fitted on 33 Development participants (1546 trials). One-time authorised Test inference covered four unseen participants and 183 trials. Primary RF subject-balanced MAE 0.0009384, predeclared secondary TCN 0.0008759; TCN lower waveform and peak-value error, RF lower peak-position error, exploratory paired bootstrap interval crosses zero. The primary remained unchanged and all 16 output files are committed; Final Quality Gate PASSED. Not an external-dataset or clinical validation.</desc>
