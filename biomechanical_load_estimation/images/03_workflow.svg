<title id="title">Numerical signal recovery and original MATLAB alignment audit</title>
<desc id="desc">Original Essex Figshare version 13. Forty source MATLAB files contain 1,897 movement records across six activities. A bounded inspection selected 50 records and 100 IMU/FE object probes, finding 92 numeric leaves (50 IMU and 42 FE), none with an observed 101- or 11-element axis. Source integrity passed; numeric waveform decoding, physical units, temporal alignment and regression readiness remain unverified. This is not a trained model.</desc>
