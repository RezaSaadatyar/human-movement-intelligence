<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
  <title id="title">NUMERICAL SIGNAL RECOVERY AND ALIGNMENT AUDIT</title>
  <desc id="desc">Original Essex source v13 comprises 40 participant files and 1897 records. The bounded numeric object recovery inspected 50 source records and 100 IMU/FE probes, observing 92 uint32-associated numeric leaves, none verified as 101-point IMU or 11-point FE waveforms. Source integrity passed; numeric signals, units and temporal alignment were not established.</desc>
