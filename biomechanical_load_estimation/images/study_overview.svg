<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="study-title study-desc">
<title id="study-title">BIOMECHANICAL LOAD ESTIMATION | ORIGINAL ESSEX STUDY</title>
<desc id="study-desc">Study-wide overview of seven lower-body IMU sensors, original 101 by 42 input and eleven by two unitless FE targets. Source inventory 1897 trials, 1729 eligible trials and 37 included subjects; participant-disjoint 29 Training, 4 Validation and 4 final Test, 183 Test trials. Five-fold Training CV selected Random Forest primary, Dilated TCN secondary. Frozen single Test evaluation achieved participant-balanced MAE 0.0009384 RF and 0.0008759 TCN; no external clinical validation.</desc>
