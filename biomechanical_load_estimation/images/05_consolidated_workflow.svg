<title id="title">Essex Stage 05 | Training-only classical regression and participant-independent validation</title>
<desc id="desc">Proposed and unexecuted stage: source-verified 1729 trial IMU-FE pairs, 29 training subjects with five-fold GroupKFold, 4 validation participants, 4 protected test participants; 210 IMU features, 22 FE outputs, three baseline models, diagnostic FE errors and provenance gate. No test evaluation or model scores asserted.</desc>
