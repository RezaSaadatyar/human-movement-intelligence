<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">Essex Stage 05 | Training-only classical regression and participant-independent validation</title>
<desc id="desc">Completed Essex Stage 05 with seven lower-body wearable IMUs represented by 42 numeric channels. Source-verified 1,729 trial IMU-FE pairs, 29 Training participants with five-fold participant-disjoint cross-validation, four diagnostic Validation participants and four untouched Test participants. Random Forest was selected on Training CV, with subject-balanced MAE 0.0007950 and Validation subject-balanced MAE 0.0006771. Twelve committed evidence files; Stage 05 Quality Gate PASSED. No Test scoring or independent external validation.</desc>
