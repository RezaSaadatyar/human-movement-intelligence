name: HMI data contract and notebook validation

on:
  push:
    paths:
      - "pyproject.toml"
      - "code/python/src/hmi/**"
      - "tests/test_hmi_contracts.py"
      - "studies/biomechanical_load_estimation/notebooks/00_data_contract.ipynb"
      - ".github/workflows/hmi-contract-notebook.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notebook-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package with notebook dependencies
        run: python -m pip install -e ".[notebooks]"
      - name: Run contract tests
        run: python -m unittest discover -s tests -p test_hmi_contracts.py -v
      - name: Execute notebook on the public BoneNet derivative
        run: |
          python -m jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=240 \
            studies/biomechanical_load_estimation/notebooks/00_data_contract.ipynb \
            --output /tmp/hmi_contract_executed.ipynb
      - name: Verify executed notebook
        run: |
          python - <<'PY'
          import nbformat
          nb=nbformat.read('/tmp/hmi_contract_executed.ipynb', as_version=4)
          cells=[c for c in nb.cells if c.cell_type=='code']
          if any(output.output_type=='error' for c in cells for output in c.get('outputs', [])):
              raise SystemExit('Notebook contains errors')
          print(f'Executed {len(cells)} code cells with no errors')
          PY
