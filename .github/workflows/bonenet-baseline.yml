name: BoneNet exploratory regression baseline

on:
  push:
    paths:
      - ".github/workflows/bonenet-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exploratory-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python requirements
        run: python -m pip install -r requirements-pilot.txt
      - name: Run explicit exploratory subject-held-out baseline
        run: |
          python scripts/bonenet_python_pilot.py --download --train \
            --accept-order-based-label-alignment \
            --report outputs/bonenet_exploratory_baseline.json
      - name: Summarise reported model metrics and scientific caveat
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("outputs/bonenet_exploratory_baseline.json").read_text())
          b=d["exploratory_baseline"]
          print("EXPLORATORY ONLY: author-assumed row-order subject labels")
          print("Train subjects:",b["train_subjects"],"test subjects:",b["test_subjects"])
          print("Train samples:",b["train_samples"],"test samples:",b["test_samples"])
          print("Metrics:",b["metrics"])
          print("Caveat:",b["caveat"])
          PY
      - name: Upload JSON report only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bonenet-exploratory-metrics-only
          path: outputs/bonenet_exploratory_baseline.json
          retention-days: 7
