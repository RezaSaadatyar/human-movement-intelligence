name: Python data loading and notebook checks

on:
  push:
    paths:
      - "requirements.txt"
      - "python_modules/core/**"
      - "biomechanical_load_estimation/code/src/**"
      - "biomechanical_load_estimation/code/notebooks/**"
      - "wearable_activity_recognition/code/src/**"
      - "wearable_activity_recognition/code/notebooks/**"
      - "tests/**"
      - ".github/workflows/python-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install standard Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q python_modules biomechanical_load_estimation/src wearable_activity_recognition/src tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Execute BoneNet notebook
        run: |
          python -m jupyter nbconvert --to notebook --execute             --ExecutePreprocessor.timeout=240             biomechanical_load_estimation/code/notebooks/01_data_loading_and_inspection.ipynb             --output /tmp/bonenet_inspection_executed.ipynb
      - name: Execute HARTH notebook
        run: |
          python -m jupyter nbconvert --to notebook --execute             --ExecutePreprocessor.timeout=240             wearable_activity_recognition/code/notebooks/01_data_loading_and_inspection.ipynb             --output /tmp/harth_inspection_executed.ipynb
      - name: Execute HARTH preprocessing notebook
        run: |
          python -m jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=240 \
            wearable_activity_recognition/code/notebooks/02_signal_preprocessing_and_windowing.ipynb \
            --output /tmp/harth_windowing_executed.ipynb
      - name: Execute HARTH feature engineering notebook
        run: |
          python -m jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=240 \
            wearable_activity_recognition/code/notebooks/03_statistical_feature_engineering.ipynb \
            --output /tmp/harth_features_executed.ipynb
      - name: Execute HARTH subject splitting notebook
        run: |
          python -m jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=360 \
            wearable_activity_recognition/code/notebooks/04_subject_independent_splitting.ipynb \
            --output /tmp/harth_split_executed.ipynb
      - name: Execute HARTH classical ML baseline notebook
        run: |
          python -m jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=480 \
            wearable_activity_recognition/code/notebooks/05_classical_ml_baselines.ipynb \
            --output /tmp/harth_ml_executed.ipynb
      - name: Execute HARTH grouped cross-validation notebook
        run: |
          python -m jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=720 \
            wearable_activity_recognition/code/notebooks/06_subject_level_cross_validation.ipynb \
            --output /tmp/harth_cv_executed.ipynb
      - name: Confirm executed notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          reports = {
              "bonenet_loading": "/tmp/bonenet_inspection_executed.ipynb",
              "harth_loading": "/tmp/harth_inspection_executed.ipynb",
              "harth_windowing": "/tmp/harth_windowing_executed.ipynb",
              "harth_features": "/tmp/harth_features_executed.ipynb",
              "harth_split": "/tmp/harth_split_executed.ipynb",
              "harth_ml": "/tmp/harth_ml_executed.ipynb",
              "harth_cv": "/tmp/harth_cv_executed.ipynb",
          }
          for name, filename in reports.items():
              assert Path(filename).is_file(), f"Missing notebook output: {filename}"
              notebook = nbformat.read(filename, as_version=4)
              cells = [c for c in notebook.cells if c.cell_type == "code"]
              assert cells and all(c.get("execution_count") is not None for c in cells)
              assert not any(
                  output.output_type == "error"
                  for cell in cells for output in cell.get("outputs", [])
              )
              print(f"PASS: {name} ({len(cells)} code cells)")
          PY
