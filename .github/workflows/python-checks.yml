name: Python data loading and notebook checks

on:
  push:
    paths:
      - "requirements.txt"
      - "python_modules/core/**"
      - "biomechanical_load_estimation/code/src/**"
      - "biomechanical_load_estimation/code/notebooks/**"
      - "wearable_activity_recognition/code/src/**"
      - "wearable_activity_recognition/code/notebooks/**"
      - "tests/**"
      - ".github/workflows/python-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install standard Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q python_modules biomechanical_load_estimation/code/src wearable_activity_recognition/code/src tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Validate Essex notebook syntax and current result tables
        run: python -m unittest discover -s tests -p 'test_essex_workflow.py' -v
