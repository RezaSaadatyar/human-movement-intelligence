name: Python data loading and notebook checks

on:
  push:
    paths:
      - "requirements.txt"
      - "code/python/src/core/**"
      - "studies/biomechanical_load_estimation/src/**"
      - "studies/biomechanical_load_estimation/notebooks/**"
      - "studies/wearable_activity_recognition/src/**"
      - "studies/wearable_activity_recognition/notebooks/**"
      - "tests/**"
      - ".github/workflows/python-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install standard Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q code/python/src studies/biomechanical_load_estimation/src studies/wearable_activity_recognition/src tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Execute BoneNet notebook
        run: |
          python -m jupyter nbconvert --to notebook --execute             --ExecutePreprocessor.timeout=240             studies/biomechanical_load_estimation/notebooks/01_data_loading_and_inspection.ipynb             --output /tmp/bonenet_inspection_executed.ipynb
      - name: Execute HARTH notebook
        run: |
          python -m jupyter nbconvert --to notebook --execute             --ExecutePreprocessor.timeout=240             studies/wearable_activity_recognition/notebooks/01_data_loading_and_inspection.ipynb             --output /tmp/harth_inspection_executed.ipynb
      - name: Execute HARTH preprocessing notebook
        run: |
          python -m jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=240 \
            studies/wearable_activity_recognition/notebooks/02_signal_preprocessing_and_windowing.ipynb \
            --output /tmp/harth_windowing_executed.ipynb
      - name: Execute HARTH feature engineering notebook
        run: |
          python -m jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=240 \
            studies/wearable_activity_recognition/notebooks/03_statistical_feature_engineering.ipynb \
            --output /tmp/harth_features_executed.ipynb
      - name: Confirm executed notebooks
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat
          reports = {
              "bonenet_loading": "/tmp/bonenet_inspection_executed.ipynb",
              "harth_loading": "/tmp/harth_inspection_executed.ipynb",
              "harth_windowing": "/tmp/harth_windowing_executed.ipynb",
              "harth_features": "/tmp/harth_features_executed.ipynb",
          }
          for name, filename in reports.items():
              assert Path(filename).is_file(), f"Missing notebook output: {filename}"
              notebook = nbformat.read(filename, as_version=4)
              cells = [c for c in notebook.cells if c.cell_type == "code"]
              assert cells and all(c.get("execution_count") is not None for c in cells)
              assert not any(
                  output.output_type == "error"
                  for cell in cells for output in cell.get("outputs", [])
              )
              print(f"PASS: {name} ({len(cells)} code cells)")
          PY
