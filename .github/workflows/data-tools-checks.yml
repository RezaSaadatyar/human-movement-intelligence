name: Data tools checks

on:
  push:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements-data.txt"
      - "requirements-pilot.txt"
      - ".github/workflows/data-tools-checks.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements-data.txt"
      - ".github/workflows/data-tools-checks.yml"

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install inspection dependencies
        run: python -m pip install -r requirements-data.txt -r requirements-pilot.txt
      - name: Check syntax
        run: python -m compileall -q scripts tests
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
