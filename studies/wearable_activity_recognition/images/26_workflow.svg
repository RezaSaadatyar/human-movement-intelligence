<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">HARTH Stage 26: Final Development Fitting and Qualified Held-Out Report</title>
<desc id="desc">Stage 26 implements the fixed Development fit for one 1D-ResNet and a Random Forest reference from six lower-back and thigh accelerometer channels. After separate approval it scores 1,000 windows from S023 and S032, participants previously inspected. No blind or external validation is claimed.</desc>
