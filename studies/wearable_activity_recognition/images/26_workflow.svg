<g aria-label="Seven stage-specific scientific process blocks"><g class="process-block"><rect x="38" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="142" y="310" font-size="12.5" font-weight="700" fill="#A7E9DF" text-anchor="middle">INPUT</text><text x="142" y="336" font-size="14.4" font-weight="700" fill="#FFFFFF" text-anchor="middle">HARTH Inputs</text><text x="142" y="358" font-size="12.4" fill="#DFEDF4" text-anchor="middle">6-channel IMU streams</text><text x="142" y="378" font-size="12.4" fill="#DFEDF4" text-anchor="middle">29 Development people</text><text x="142" y="398" font-size="12.4" fill="#DFEDF4" text-anchor="middle">Test cohort separate</text></g><g class="process-block"><rect x="274" y="287" width="208" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="378" y="310" font-size="12.5" font-weight="700" fill="#497992" text-anchor="middle">01</text><text x="378" y="336" font-size="14.4" font-weight="700" fill="#173453" text-anchor="middle">Check Protocol</text><text x="378" y="358" font-size="12.4" fill="#506C7E" text-anchor="middle">Frozen source and labels</text><text x="378" y="378" font-size="12.4" fill="#506C7E" text-anchor="middle">Reserved subject boundary</text><text x="378" y="398" font-size="12.4" fill="#506C7E" text-anchor="middle">Approved model contract</text></g><g class="process-block"><rect x="510" y="287" width="208" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="614" y="310" font-size="12.5" font-weight="700" fill="#497992" text-anchor="middle">02</text><text x="614" y="336" font-size="14.4" font-weight="700" fill="#173453" text-anchor="middle">Fit Dev Models</text><text x="614" y="358" font-size="12.4" fill="#506C7E" text-anchor="middle">Weighted 1D-ResNet</text><text x="614" y="378" font-size="12.4" fill="#506C7E" text-anchor="middle">120-tree Random Forest</text><text x="614" y="398" font-size="12.4" fill="#506C7E" text-anchor="middle">Dev-fitted preprocessing</text></g><g class="process-block"><rect x="746" y="287" width="208" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="850" y="310" font-size="12.5" font-weight="700" fill="#497992" text-anchor="middle">03</text><text x="850" y="336" font-size="14.4" font-weight="700" fill="#173453" text-anchor="middle">Save and Reload</text><text x="850" y="358" font-size="12.4" fill="#506C7E" text-anchor="middle">Weights, scaler, metadata</text><text x="850" y="378" font-size="12.4" fill="#506C7E" text-anchor="middle">Round-trip inference</text><text x="850" y="398" font-size="12.4" fill="#506C7E" text-anchor="middle">Provenance checks</text></g><g class="process-block"><rect x="982" y="287" width="208" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="1086" y="310" font-size="12.5" font-weight="700" fill="#497992" text-anchor="middle">04</text><text x="1086" y="336" font-size="14.4" font-weight="700" fill="#173453" text-anchor="middle">Approval Gate</text><text x="1086" y="358" font-size="12.4" fill="#506C7E" text-anchor="middle">Independent prior approval</text><text x="1086" y="378" font-size="12.4" fill="#506C7E" text-anchor="middle">S023 and S032 only</text><text x="1086" y="398" font-size="12.4" fill="#506C7E" text-anchor="middle">No Test-driven changes</text></g><g class="process-block"><rect x="1218" y="287" width="208" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="1322" y="310" font-size="12.5" font-weight="700" fill="#497992" text-anchor="middle">05</text><text x="1322" y="336" font-size="14.4" font-weight="700" fill="#173453" text-anchor="middle">Score Held-Out</text><text x="1322" y="358" font-size="12.4" fill="#506C7E" text-anchor="middle">1,000 labelled windows</text><text x="1322" y="378" font-size="12.4" fill="#506C7E" text-anchor="middle">Per-class and per-person</text><text x="1322" y="398" font-size="12.4" fill="#506C7E" text-anc