<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">HARTH Stage 04: Participant-Independent Data Splitting</title>
<desc id="figure-description">Eight individuals with two tri-axial accelerometers, label-pure source windows and 30 features per sample. The early exploratory experiment creates 4 training, 2 validation and 2 test subjects, validates zero overlap and compares class percentages. It reports but does not interpret unrecognised annotation codes.</desc>
<defs><marker id="small-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs>
<rect width="1700" height="480" rx="20" fill="#F4F9FD"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="30" y="38" font-size="23" font-weight="700" fill="#173453">STAGE 04 | SUBJECT-INDEPENDENT DATA SPLITTING</text>
<text x="30" y="67" font-size="15" fill="#54738A">Exploratory eight-participant study · Whole-person partitioning · No supervised model fitting</text>
<rect x="24" y="84" width="1652" height="160" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<rect x="24" y="262" width="1652" height="174" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<g aria-label="Rear-view wearable sensor placement completely inside the upper panel">
<text x="50" y="105" font-size="11.5" font-weight="700" fill="#53738A">REAR-VIEW SENSOR PLACEMENT</text>
<g stroke="#7298B0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
<circle cx="95" cy="128" r="12" fill="#FFFFFF"/>
<path d="M91 140 L91 147 M99 140 L99 147" fill="none"/>
<path d="M77 149 Q95 143 113 149 L116 174 Q109 187 95 189 Q81 187 74 174 Z" fill="#D9E7F1"/>
<path d="M77 153 L65 178 L67 193 M113 153 L125 178 L123 193" fill="none"/>
<path d="M84 189 L80 213 L79 226 M106 189 L111 214 L112 226" fill="none"/>
<path d="M79 226 L88 227 M112 226 L120 227" fill="none"/>
</g>
<rect x="86" y="171" width="18" height="11" rx="2.5" fill="#245E9D" stroke="#FFFFFF" stroke-width="1.3"/>
<rect x="77" y="199" width="16" height="11" rx="2.5" fill="#22A0A0" stroke="#FFFFFF" stroke-width="1.3"/>
<path d="M104 176 H140" stroke="#245E9D" stroke-width="1.5"/><text x="146" y="180" font-size="12.8" fill="#173453">Lower back</text>
<path d="M93 204 H140" stroke="#15938F" stroke-width="1.5"/><text x="146" y="208" font-size="12.8" fill="#173453">Thigh</text>
</g>
<g>
<text x="338" y="115" font-size="15" font-weight="700" fill="#173453">Eight Recorded Participants</text>
<text x="338" y="145" font-size="13.5" fill="#506C7E">S023, S024, S025, S027</text>
<text x="338" y="167" font-size="13.5" fill="#506C7E">S028, S032, S034, S035</text>
<text x="338" y="189" font-size="13.5" fill="#506C7E">6 axes · 50 Hz · original labels</text>
</g>
<g>
<text x="636" y="115" font-size="15" font-weight="700" fill="#173453">Source Processing</text>
<text x="636" y="145" font-size="13.5" fill="#506C7E">2-second windows · 50% overlap</text>
<text x="636" y="167" font-size="13.5" fill="#506C7E">5 features per axis · 30 columns</text>
<text x="636" y="189" font-size="13.5" fill="#506C7E">25,963 retained source windows</text>
</g>
<g aria-label="Schematic distribution of eight disjoint participants">
<text x="975" y="113" font-size="14" font-weight="700" fill="#173453">WHOLE-PERSON SPLIT | 4 / 2 / 2</text>
<rect x="980" y="129" width="112" height="14" rx="3" fill="#245E9D"/><text x="1101" y="140" font-size="12" fill="#486779">Train (4)</text>
<rect x="980" y="153" width="56" height="14" rx="3" fill="#22A0A0"/><text x="1045" y="164" font-size="12" fill="#486779">Validation (2)</text>
<rect x="980" y="177" width="56" height="14" rx="3" fill="#8793B0"/><text x="1045" y="188" font-size="12" fill="#486779">Test (2)</text>
<text x="975" y="220" font-size="11.8" fill="#54738A">Bars represent participant counts, not window counts</text>
</g>
<g>
<text x="1300" y="115" font-size="15" font-weight="700" fill="#173453">Annotation Audit</text>
<text x="1300" y="145" font-size="13.5" fill="#506C7E">S032 includes unknown codes 10 / 11</text>
<text x="1300" y="167" font-size="13.5" fill="#506C7E">Retained code 10 remains flagged</text>
<text x="1300" y="189" font-size="13.5" fill="#506C7E">Classifier training: NOT APPROVED</text>
</g>
<g aria-label="Six equally sized, small right-facing arrows"><path d="M252 353 H266" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/>
<path d="M488 353 H502" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/>
<path d="M724 353 H738" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/>
<path d="M960 353 H974" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/>
<path d="M1196 353 H1210" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/>
<path d="M1432 353 H1446" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/></g>
<g aria-label="Seven original-data-to-quality-gate stages"><g class="process-block">
 <rect x="38" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/>
 <text x="142" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A7E9DF">INPUT</text>
 <text x="142" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">HARTH v2.0</text>
 <text x="142" y="358" text-anchor="middle" font-size="12.6" fill="#DFEDF4">8 source participants</text>
 <text x="142" y="378" text-anchor="middle" font-size="12.6" fill="#DFEDF4">Back + thigh IMUs</text>
 <text x="142" y="398" text-anchor="middle" font-size="12.6" fill="#DFEDF4">50 Hz · original labels</text>
 </g>
<g class="process-block">
 <rect x="274" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
 <text x="378" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">01</text>
 <text x="378" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Load Sources</text>
 <text x="378" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">Retrieve or reuse CSVs</text>
 <text x="378" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Source-verified identity</text>
 <text x="378" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Keep original samples</text>
 </g>
<g class="process-block">
 <rect x="510" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
 <text x="614" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">02</text>
 <text x="614" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Per-Person Windows</text>
 <text x="614" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">100 samples · stride 50</text>
 <text x="614" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Pure labels / no gaps</text>
 <text x="614" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Do not cross people</text>
 </g>
<g class="process-block">
 <rect x="746" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
 <text x="850" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">03</text>
 <text x="850" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Extract Features</text>
 <text x="850" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">5 methods × 6 axes</text>
 <text x="850" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">25,963 rows × 30 cols</text>
 <text x="850" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Retain participant IDs</text>
 </g>
<g class="process-block">
 <rect x="982" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
 <text x="1086" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">04</text>
 <text x="1086" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Group Split</text>
 <text x="1086" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">4 Train · 2 Validation</text>
 <text x="1086" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">2 exploratory Test</text>
 <text x="1086" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Seed 42 · no leakage</text>
 </g>
<g class="process-block">
 <rect x="1218" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
 <text x="1322" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">05</text>
 <text x="1322" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Distribution Audit</text>
 <text x="1322" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">Grouped bars + heatmap</text>
 <text x="1322" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Within-split class %</text>
 <text x="1322" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Unknown codes flagged</text>
 </g>
<g class="process-block">
 <rect x="1454" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/>
 <text x="1558" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A7E9DF">OUTPUT</text>
 <text x="1558" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Quality Gate</text>
 <text x="1558" y="358" text-anchor="middle" font-size="12.6" fill="#DFEDF4">No participant overlap</text>
 <text x="1558" y="378" text-anchor="middle" font-size="12.6" fill="#DFEDF4">All windows accounted</text>
 <text x="1558" y="398" text-anchor="middle" font-size="12.6" fill="#DFEDF4">No classifier trained</text>
 </g></g>
<text x="30" y="466" font-size="13.2" fill="#54738A">8 source subjects → person-wise windowing → 30-feature extraction → disjoint 4/2/2 exploratory partition → class audit → group integrity gate</text>
</g>
</svg>
