<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">HARTH Notebook 06: Participant-Level Development Cross-Validation</title>
<desc id="desc">Wearable lower-back and thigh accelerometer data from eight source participants lead to Development-only six-person GroupKFold evaluation across three folds, with S023 and S032 reserved for Test. Dummy, Logistic Regression and Random Forest scores are examined by fold and participant. Seven horizontally aligned process blocks use six small uniform arrowheads.</desc>
<defs><marker id="small-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs>
<rect width="1700" height="480" rx="20" fill="#F4F9FD"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
 <text x="30" y="38" font-size="23" font-weight="700" fill="#173453">STAGE 06 | SUBJECT-LEVEL CROSS-VALIDATION</text>
 <text x="30" y="67" font-size="15" fill="#54738A">Six Development subjects · Three person-disjoint folds · Baseline comparison without reserved Test inference</text>
 <rect x="24" y="84" width="1652" height="160" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
 <rect x="24" y="262" width="1652" height="174" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
