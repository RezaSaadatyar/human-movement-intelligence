<g><rect x="1270" y="194" width="25" height="15" rx="3" fill="#245E9D" /><rect x="1301" y="194" width="25" height="15" rx="3" fill="#245E9D" /><rect x="1332" y="194" width="25" height="15" rx="3" fill="#245E9D" /><rect x="1363" y="194" width="25" height="15" rx="3" fill="#245E9D" /><rect x="1394" y="194" width="25" height="15" rx="3" fill="#22A0A0" /><rect x="1425" y="194" width="25" height="15" rx="3" fill="#22A0A0" /><text x="1468" y="206" font-size="12" fill="#506C7E">Fold 3</text></g>
  <text x="1270" y="236" font-size="11.8" fill="#53738A">Blue: 4 Train · Teal: 2 Validation per fold</text>
 </g>
