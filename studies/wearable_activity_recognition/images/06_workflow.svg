   <path d="M84 189 L80 213 L79 226 M106 189 L111 214 L112 226" fill="none"/>
   <path d="M79 226 L88 227 M112 226 L120 227" fill="none"/>
  </g>
  <rect x="86" y="171" width="18" height="11" rx="2.5" fill="#245E9D" stroke="#FFFFFF" stroke-width="1.3"/>
  <rect x="77" y="199" width="16" height="11" rx="2.5" fill="#22A0A0" stroke="#FFFFFF" stroke-width="1.3"/>
  <path d="M104 176 H140" stroke="#245E9D" stroke-width="1.5"/><text x="146" y="180" font-size="12.8" fill="#173453">Lower back</text>
  <path d="M93 204 H140" stroke="#15938F" stroke-width="1.5"/><text x="146" y="208" font-size="12.8" fill="#173453">Thigh</text>
 </g>
 <g>
  <text x="338" y="115" font-size="15" font-weight="700" fill="#173453">Source Modalities</text>
  <text x="338" y="145" font-size="13.5" fill="#506C7E">8 original HARTH participants</text>
  <text x="338" y="167" font-size="13.5" fill="#506C7E">back_x/y/z + thigh_x/y/z</text>
  <text x="338" y="189" font-size="13.5" fill="#506C7E">2-second windows · 30 features</text>
 </g>
 <g>
  <text x="650" y="115" font-size="15" font-weight="700" fill="#173453">Frozen Historical Split</text>
  <text x="650" y="145" font-size="13.5" fill="#506C7E">Development: 6 people · 18,959 windows</text>
  <text x="650" y="167" font-size="13.5" fill="#506C7E">Reserved: S023 and S032</text>
  <text x="650" y="189" font-size="13.5" fill="#506C7E">Only classes 1–8 included after windowing</text>
 </g>
 <g>
  <text x="975" y="115" font-size="15" font-weight="700" fill="#173453">Model and Metric Protocol</text>
  <text x="975" y="145" font-size="13.5" fill="#506C7E">Dummy · Logistic Regression · RF</text>
  <text x="975" y="167" font-size="13.5" fill="#506C7E">Macro F1, balanced accuracy</text>
  <text x="975" y="189" font-size="13.5" fill="#506C7E">Train-only scaler within each fold</text>
 </g>
 <g aria-label="Conceptual three-fold GroupKFold schematic, green is validation">
  <text x="1270" y="114" font-size="14" font-weight="700" fill="#173453">3-FOLD PERSON-HELD-OUT CV</text>
  <g><rect x="1270" y="134" width="25" height="15" rx="3" fill="#22A0A0" /><rect x="1301" y="134" width="25" height="15" rx="3" fill="#22A0A0" /><rect x="1332" y="134" width="25" height="15" rx="3" fill="#245E9D" /><rect x="1363" y="134" width="25" height="15" rx="3" fill="#245E9D" /><rect x="1394" y="134" width="25" height="15" rx="3" fill="#245E9D" /><rect x="1425" y="134" width="25" height="15" rx="3" fill="#245E9D" /><text x="1468" y="146" font-size="12" fill="#506C7E">Fold 1</text></g>
