 <text x="850" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">GroupKFold CV</text>
 <text x="850" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">3 disjoint folds</text>
 <text x="850" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">4 Train / 2 held out</text>
 <text x="850" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">No person overlap</text>
 </g>
<g class="process-block">
 <rect x="982" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
