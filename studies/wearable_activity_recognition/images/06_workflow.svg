 <text x="1086" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Fit Baselines</text>
 <text x="1086" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">Dummy · Logistic Reg.</text>
 <text x="1086" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Random Forest</text>
 <text x="1086" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Train-only scaling</text>
 </g>
<g class="process-block">
 <rect x="1218" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
 <text x="1322" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">05</text>
 <text x="1322" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Inspect Variation</text>
 <text x="1322" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">Macro F1 per fold</text>
 <text x="1322" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Six held-out people</text>
 <text x="1322" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Participant-level F1</text>
 </g>
<g class="process-block">
 <rect x="1454" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/>
 <text x="1558" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A7E9DF">OUTPUT</text>
 <text x="1558" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Quality Gate</text>
 <text x="1558" y="358" text-anchor="middle" font-size="12.6" fill="#DFEDF4">9 fold × model scores</text>
 <text x="1558" y="378" text-anchor="middle" font-size="12.6" fill="#DFEDF4">Reserved Test not scored</text>
 <text x="1558" y="398" text-anchor="middle" font-size="12.6" fill="#DFEDF4">No external validity</text>
 </g></g>
 <text x="30" y="466" font-size="13.2" fill="#54738A">Original IMUs → safe windows and statistics → reserve Test → 3 group-disjoint Development folds → baseline fits → fold/person F1 → quality checks</text>
</g>
</svg>
