<g><text x="658" y="115" font-size="15" font-weight="700" fill="#173453" >Saved Experimental Evidence</text><text x="658" y="145" font-size="13.2" fill="#173453" >Stage 23 · seven-model benchmark</text><text x="658" y="167" font-size="13.2" fill="#173453" >Stage 24 · 3 seeds and 36 fits</text><text x="658" y="189" font-size="13.2" fill="#173453" >3 participant-disjoint folds</text><text x="658" y="220" font-size="11.5" fill="#54738A" >No new model training in Stage 25</text></g>
