<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">HARTH Stage 15: Strictly Nested Training-Size Ablation on Fixed Validation Subjects</title>
<desc id="desc">A HARTH v2.0 nested training-window comparison uses 29 Development participants and six-axis lower-back and thigh recordings. Original 500-cap training windows are all retained in 1000-cap Train: 10000 versus 20000 Train windows from the same 20 people. Six fixed Validation participants and exactly 2701 original source windows are unchanged. Random Forest last-epoch-equivalent Validation Macro F1 is 0.8266 versus 0.8644; weighted temporal CNN final-epoch Macro F1 is 0.7968 versus 0.7805, with an epoch-four score of 0.8428 for expanded CNN. S023 and S032 remain reserved outside the study; results are exploratory Development validation, not final Test evidence.</desc>
<defs><marker id="small-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs>
<rect width="1700" height="480" rx="20" fill="#F4F9FD"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
