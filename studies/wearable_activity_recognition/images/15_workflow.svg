 <g><text x="658" y="115" font-size="15" font-weight="700" fill="#173453">Identical Subject Groups</text><text x="658" y="145" font-size="13.5" fill="#506C7E">20 Train · 6 Validation</text><text x="658" y="167" font-size="13.5" fill="#506C7E">3 unused Development people</text><text x="658" y="189" font-size="13.5" fill="#506C7E">Train: 10,000 vs 20,000 windows</text></g>
 <g><text x="985" y="115" font-size="15" font-weight="700" fill="#173453">Controlled Validation Audit</text><text x="985" y="145" font-size="13.5" fill="#506C7E">Exactly 2,701 unchanged rows</text><text x="985" y="167" font-size="13.5" fill="#506C7E">120-tree RF · 5-epoch CNN</text><text x="985" y="189" font-size="13.5" fill="#506C7E">CNN 1000 epoch-4 F1: 0.8428</text></g>
