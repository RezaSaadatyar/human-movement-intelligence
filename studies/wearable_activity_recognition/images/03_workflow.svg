<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">HARTH Stage 03: Statistical Feature Engineering</title>
<desc id="desc">Horizontal scientific workflow: six lower-back and thigh accelerometer signals, two-second label-pure windows, five statistical features per channel, 2567 by 30 source feature matrix and activity-level RMS diagnostics.</desc>
<defs><marker id="small-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs>
<rect width="1700" height="480" rx="20" fill="#F4F9FD"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="30" y="38" font-size="23" font-weight="700" fill="#173453">STAGE 03 | STATISTICAL FEATURE ENGINEERING</text>
<text x="30" y="67" font-size="15" fill="#54738A">Deterministic five-method feature extraction · One HARTH participant · No feature selection or classifier fitting</text>
<rect x="24" y="84" width="1652" height="160" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<rect x="24" y="262" width="1652" height="174" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<g aria-label="Rear-view sensor placement: lower back and thigh">
<text x="50" y="105" font-size="11.5" font-weight="700" fill="#53738A">REAR-VIEW SENSOR PLACEMENT</text>
<g stroke="#7298B0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
<circle cx="95" cy="128" r="12" fill="#FFFFFF"/>
<path d="M91 140 L91 147 M99 140 L99 147" fill="none"/>
<path d="M77 149 Q95 143 113 149 L116 174 Q109 187 95 189 Q81 187 74 174 Z" fill="#D9E7F1"/>
<path d="M77 153 L65 178 L67 193 M113 153 L125 178 L123 193" fill="none"/>
<path d="M84 189 L80 213 L79 226 M106 189 L111 214 L112 226" fill="none"/>
<path d="M79 226 L88 227 M112 226 L120 227" fill="none"/>
</g>
<rect x="86" y="171" width="18" height="11" rx="2.5" fill="#245E9D" stroke="#FFFFFF" stroke-width="1.3"/>
<rect x="77" y="199" width="16" height="11" rx="2.5" fill="#22A0A0" stroke="#FFFFFF" stroke-width="1.3"/>
<path d="M104 176 H140" stroke="#245E9D" stroke-width="1.5"/><text x="146" y="180" font-size="12.8" fill="#173453">Lower back</text>
<path d="M93 204 H140" stroke="#15938F" stroke-width="1.5"/><text x="146" y="208" font-size="12.8" fill="#173453">Thigh</text>
</g>
<g><text x="338" y="115" font-size="15" font-weight="700" fill="#173453">Wearable Data</text>
<text x="338" y="145" font-size="13.5" fill="#506C7E">S023.csv · 50 Hz</text>
<text x="338" y="167" font-size="13.5" fill="#506C7E">back_x/y/z · thigh_x/y/z</text>
<text x="338" y="189" font-size="13.5" fill="#506C7E">Tri-axial acceleration (g)</text></g>
<g><text x="606" y="115" font-size="15" font-weight="700" fill="#173453">Sliding Windows</text>
<text x="606" y="145" font-size="13.5" fill="#506C7E">100 samples · 2 seconds</text>
<text x="606" y="167" font-size="13.5" fill="#506C7E">Stride 50 · 50% overlap</text>
<text x="606" y="189" font-size="13.5" fill="#506C7E">100% label purity · time continuity</text></g>
<g><text x="905" y="115" font-size="15" font-weight="700" fill="#173453">Five Features per Axis</text>
<text x="905" y="145" font-size="13.5" fill="#506C7E">Mean · Standard deviation</text>
<text x="905" y="167" font-size="13.5" fill="#506C7E">Root mean square (RMS)</text>
<text x="905" y="189" font-size="13.5" fill="#506C7E">Peak-to-peak · Waveform length</text></g>
<g aria-label="Illustrative feature extraction, not an observed signal">
<text x="1256" y="115" font-size="14" font-weight="700" fill="#173453">SIGNAL TO FEATURES (SCHEMATIC)</text>
<rect x="1257" y="133" width="175" height="83" rx="7" fill="#D4E7F3" opacity="0.75"/>
<line x1="1265" y1="176" x2="1420" y2="176" stroke="#99B7C8" stroke-width="1"/>
