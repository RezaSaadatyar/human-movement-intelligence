<path d="M1443 175 H1475 L1468 171 M1475 175 L1468 179" fill="none" stroke="#245E9D" stroke-width="2"/>
<rect x="1488" y="140" width="148" height="70" rx="8" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/>
<text x="1562" y="159" text-anchor="middle" font-size="12" font-weight="700" fill="#173453">30 FEATURES</text>
<text x="1562" y="177" text-anchor="middle" font-size="11.7" fill="#506C7E">6 axes × 5 statistics</text>
<text x="1562" y="195" text-anchor="middle" font-size="11.7" fill="#506C7E">per window</text>
<text x="1260" y="232" font-size="11.5" fill="#53738A">Illustration of the per-window feature transformation</text></g>
<g aria-label="Six uniform compact workflow arrows"><path d="M252 353 H266" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/>
<path d="M488 353 H502" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/>
<path d="M724 353 H738" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/>
<path d="M960 353 H974" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/>
<path d="M1196 353 H1210" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/>
<path d="M1432 353 H1446" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/></g>
<g aria-label="Seven sequential processing stages"><g class="process-block"><rect x="38" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="142" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A7E9DF">INPUT</text><text x="142" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">HARTH v2.0</text><text x="142" y="358" text-anchor="middle" font-size="12.6" fill="#DFEDF4">S023 · six axes</text><text x="142" y="378" text-anchor="middle" font-size="12.6" fill="#DFEDF4">50 Hz · original labels</text><text x="142" y="398" text-anchor="middle" font-size="12.6" fill="#DFEDF4">137,646 raw samples</text></g>
<g class="process-block"><rect x="274" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="378" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">01</text><text x="378" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Load Source</text><text x="378" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">Cached or official CSV</text><text x="378" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Inspect source channels</text><text x="378" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Original values in g</text></g>
<g class="process-block"><rect x="510" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="614" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">02</text><text x="614" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Create Windows</text><text x="614" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">100 samples · stride 50</text><text x="614" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">100% label purity</text><text x="614" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Reject time gaps</text></g>
<g class="process-block"><rect x="746" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="850" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">03</text><text x="850" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Extract Features</text><text x="850" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">Mean · STD · RMS</text><text x="850" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Peak-to-peak range</text><text x="850" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Waveform length</text></g>
<g class="process-block"><rect x="982" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="1086" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">04</text><text x="1086" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Feature Matrix</text><text x="1086" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">2,567 retained windows</text><text x="1086" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">6 axes × 5 methods</text><text x="1086" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">2,567 × 30 features</text></g>
<g class="process-block"><rect x="1218" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="1322" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">05</text><text x="1322" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">RMS Diagnostics</text><text x="1322" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">Back and thigh RMS</text><text x="1322" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Activity scatter plot</text><text x="1322" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Class support / boxplot</text></g>
<g class="process-block"><rect x="1454" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="1558" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A7E9DF">OUTPUT</text><text x="1558" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Quality Gate</text><text x="1558" y="358" text-anchor="middle" font-size="12.6" fill="#DFEDF4">Finite feature values</text><text x="1558" y="378" text-anchor="middle" font-size="12.6" fill="#DFEDF4">Unique names · aligned rows</text><text x="1558" y="398" text-anchor="middle" font-size="12.6" fill="#DFEDF4">No classifier training</text></g></g>
<text x="30" y="466" font-size="13.2" fill="#54738A">Six-axis source → label-pure windows → five features per axis → 30-column matrix → activity RMS plots → integrity gate</text>
</g>
</svg>
