<title id="title">HARTH Notebook 07: Expanded Ten-Participant Development Evaluation</title>
<desc id="desc">Wearable lower-back and thigh accelerometer recordings from ten Development participants are processed into 31903 eligible windows and 30 statistical features per window. Five participant-disjoint GroupKFold splits compare three classical models. Original final Test subjects S023 and S032 are not loaded or scored in this notebook. Seven landscape blocks use six equal small arrowheads.</desc>
