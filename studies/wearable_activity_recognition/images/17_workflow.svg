 </g>
 <g><text x="338" y="115" font-size="15" font-weight="700" fill="#173453">HARTH Development Cohort</text><text x="338" y="145" font-size="13.5" fill="#506C7E">29 people · lower back and thigh</text><text x="338" y="167" font-size="13.5" fill="#506C7E">14,201 base · 28,201 expanded</text><text x="338" y="189" font-size="13.5" fill="#506C7E">S023 / S032 excluded</text></g>
 <g><text x="658" y="115" font-size="15" font-weight="700" fill="#173453">Matched Fold Design</text><text x="658" y="145" font-size="13.5" fill="#506C7E">Three subject-disjoint folds</text><text x="658" y="167" font-size="13.5" fill="#506C7E">10 / 10 / 9 Validation people</text><text x="658" y="189" font-size="13.5" fill="#506C7E">Only base-500 Validation rows</text></g>
 <g><text x="985" y="115" font-size="15" font-weight="700" fill="#173453">Equal Optimiser Budgets</text><text x="985" y="145" font-size="13.5" fill="#506C7E">Weighted CNN 500 vs 1000</text><text x="985" y="167" font-size="13.5" fill="#506C7E">400 updates · eval each 100</text><text x="985" y="189" font-size="13.5" fill="#506C7E">Train-only scaling and weights</text></g>
