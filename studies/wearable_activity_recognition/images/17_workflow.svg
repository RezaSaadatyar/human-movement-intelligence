<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">HARTH Stage 17: Fixed 400-Optimiser-Step Weighted CNN Comparison</title>
<desc id="desc">A matched developmental study holds out complete HARTH participants across three GroupKFold splits and compares Train-500 and Train-1000 weighted temporal CNNs at exactly 400 optimiser updates each. Shared development data consist of 14201 base and 28201 expanded source windows, with 29 participants. Held-out original base windows and classes are identical within a fold. Mean final-step Macro F1 is 0.7746 for Weighted CNN 500 and 0.7927 for Weighted CNN 1000. The original final Test participants S023 and S032 are excluded; results are not independent external validation.</desc>
<defs><marker id="small-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs>
<rect width="1700" height="480" rx="20" fill="#F4F9FD"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
 <text x="30" y="38" font-size="23" font-weight="700" fill="#173453">STAGE 17 | FIXED-STEP TRAINING-BUDGET ABLATION</text>
 <text x="30" y="67" font-size="15" fill="#54738A">29 Development people · 3 matched folds · 400 optimiser updates per run · No final Test inference</text>
