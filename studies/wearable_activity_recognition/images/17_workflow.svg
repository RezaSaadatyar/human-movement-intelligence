 <g aria-label="Seven matched-protocol research workflow blocks"><g class="process-block"><rect x="38" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="142" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A7E9DF">INPUT</text><text x="142" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">HARTH v2.0</text><text x="142" y="358" text-anchor="middle" font-size="12.5" fill="#DFEDF4">29 Development people</text><text x="142" y="378" text-anchor="middle" font-size="12.5" fill="#DFEDF4">Lower back + thigh</text><text x="142" y="398" text-anchor="middle" font-size="12.5" fill="#DFEDF4">Six axes · 50 Hz</text></g>
<g class="process-block"><rect x="274" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="378" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">01</text><text x="378" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Nested Windows</text><text x="378" y="358" text-anchor="middle" font-size="12.5" fill="#506C7E">14,201 base windows</text><text x="378" y="378" text-anchor="middle" font-size="12.5" fill="#506C7E">28,201 expanded windows</text><text x="378" y="398" text-anchor="middle" font-size="12.5" fill="#506C7E">Reserved Test excluded</text></g>
<g class="process-block"><rect x="510" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="614" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">02</text><text x="614" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Freeze Folds</text><text x="614" y="358" text-anchor="middle" font-size="12.5" fill="#506C7E">Three held-out folds</text><text x="614" y="378" text-anchor="middle" font-size="12.5" fill="#506C7E">Base-500 Validation</text><text x="614" y="398" text-anchor="middle" font-size="12.5" fill="#506C7E">No person overlap</text></g>
