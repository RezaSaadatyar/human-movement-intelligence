 <g><text x="338" y="115" font-size="15" font-weight="700" fill="#173453">Wearable Development Data</text><text x="338" y="145" font-size="13.5" fill="#506C7E">29 people · 14,201 capped windows</text><text x="338" y="167" font-size="13.5" fill="#506C7E">6 sensor axes · 100 time points</text><text x="338" y="189" font-size="13.5" fill="#506C7E">Eight documented HARTH activities</text></g>
 <g><text x="658" y="115" font-size="15" font-weight="700" fill="#173453">Three Matched Models</text><text x="658" y="145" font-size="13.5" fill="#506C7E">RF: 30 deterministic features</text><text x="658" y="167" font-size="13.5" fill="#506C7E">Standard CNN: raw 6 × 100</text><text x="658" y="189" font-size="13.5" fill="#506C7E">Weighted CNN: Train-class loss weights</text></g>
 <g><text x="985" y="115" font-size="15" font-weight="700" fill="#173453">Group-Held-Out Design</text><text x="985" y="145" font-size="13.5" fill="#506C7E">Three participant-disjoint folds</text><text x="985" y="167" font-size="13.5" fill="#506C7E">19/10, 19/10 and 20/9 people</text><text x="985" y="189" font-size="13.5" fill="#506C7E">CNN: five epochs per fold</text></g>
