<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">HARTH Stage 13: Matched Three-Model Grouped Cross-Validation</title>
<desc id="desc">Twenty-nine Development participants contribute 14201 capped HARTH accelerometer windows with six axes and 100 time points each. Three participant-disjoint folds compare Random Forest using 30 statistical features, Standard CNN and Train-weighted CNN. Development fold-mean Macro F1 results are 0.8076, 0.6301 and 0.7834 respectively. Paired analysis spans all 29 Development subjects with no original final Test source access to S023 or S032. This is exploratory grouped validation, not an independently confirmed superiority claim.</desc>
<defs><marker id="small-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs>
