  <text x="338" y="145" font-size="13.5" fill="#506C7E">29 Development participants</text>
  <text x="338" y="167" font-size="13.5" fill="#506C7E">14,201 windows · 6 × 100</text>
  <text x="338" y="189" font-size="13.5" fill="#506C7E">20 Train · 6 Validation · 3 unused</text>
 </g>
