<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">HARTH Notebook 21: Original Source Quality and Minority-Class Audit</title>
<desc id="desc">A read-only scientific source-data audit across 29 HARTH Development participants with lower-back and thigh accelerometers. Eight million six thousand seven hundred forty-one original signal rows and 144105 time-continuous pure-label windows yield 132397 eligible eight-class task windows; 11708 accepted windows are excluded by source task codes. The stage checks label provenance, timestamp discontinuities, annotation bout durations, candidate rejections, label-blind sampling, person-level class coverage and raw channel diagnostics. S023 and S032 are excluded. No classifier is trained and no cause of model errors or sensor failure is established.</desc>
<defs><marker id="small-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs>
<rect width="1700" height="480" rx="20" fill="#F4F9FD"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
 <text x="30" y="38" font-size="23" font-weight="700" fill="#173453">STAGE 21 | SOURCE QUALITY AND MINORITY-CLASS AUDIT</text>
 <text x="30" y="67" font-size="15" fill="#54738A">Pinned HARTH source recordings · Label provenance, short bouts and time gaps · No model fitting or Test scoring</text>
