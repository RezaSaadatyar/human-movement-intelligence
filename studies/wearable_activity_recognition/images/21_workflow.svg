 <g><text x="658" y="115" font-size="15" font-weight="700" fill="#173453">Window Integrity Checks</text><text x="658" y="145" font-size="13.5" fill="#506C7E">50 Hz · 2 s · stride 50</text><text x="658" y="167" font-size="13.5" fill="#506C7E">Pure labels and continuous time</text><text x="658" y="189" font-size="13.5" fill="#506C7E">Exclude unsupported task codes</text></g>
