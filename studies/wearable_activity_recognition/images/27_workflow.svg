<g aria-label="Seven stage-specific scientific process blocks"><g class="process-block"><rect x="38" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="142" y="310" font-size="12.5" font-weight="700" fill="#A7E9DF" text-anchor="middle">INPUT</text><text x="142" y="336" font-size="14.4" font-weight="700" fill="#FFFFFF" text-anchor="middle">Saved Evidence</text><text x="142" y="358" font-size="12.4" fill="#DFEDF4" text-anchor="middle">Notebooks 23 through 26</text><text x="142" y="378" font-size="12.4" fill="#DFEDF4" text-anchor="middle">Approval and provenance</text><text x="142" y="398" font-size="12.4" fill="#DFEDF4" text-anchor="middle">No raw recordings</text></g><g class="process-block"><rect x="274" y="287" width="208" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="378" y="310" font-size="12.5" font-weight="700" fill="#497992" text-anchor="middle">01</text><text x="378" y="336" font-size="14.4" font-weight="700" fill="#173453" text-anchor="middle">Check Integrity</text><text x="378" y="358" font-size="12.4" fill="#506C7E" text-anchor="middle">Verify source/manifest</text><text x="378" y="378" font-size="11.2" fill="#506C7E" text-anchor="middle">Inspect saved Quality Gates</text><text x="378" y="398" font-size="12.4" fill="#506C7E" text-anchor="middle">Compare source evidence</text></g><g class="process-block"><rect x="510" y="287" width="208" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="614" y="310" font-size="12.5" font-weight="700" fill="#497992" text-anchor="middle">02</text><text x="614" y="336" font-size="14.4" font-weight="700" fill="#173453" text-anchor="middle">Dev Benchmark</text><text x="614" y="358" font-size="12.4" fill="#506C7E" text-anchor="middle">7-model fold metrics</text><text x="614" y="378" font-size="12.4" fill="#506C7E" text-anchor="middle">36 multiseed fits</text><text x="614" y="398" font-size="12.4" fill="#506C7E" text-anchor="middle">Class and person support</text></g><g class="process-block"><rect x="746" y="287" width="208" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="850" y="310" font-size="12.5" font-weight="700" fill="#497992" text-anchor="middle">03</text><text x="850" y="336" font-size="14.4" font-weight="700" fill="#173453" text-anchor="middle">Review Test</text><text x="850" y="358" font-size="12.4" fill="#506C7E" text-anchor="middle">Two frozen models</text><text x="850" y="378" font-size="12.4" fill="#506C7E" text-anchor="middle">Qualified prior scoring</text><text x="850" y="398" font-size="12.4" fill="#506C7E" text-anchor="middle">Original S023 / S032</text></g><g class="process-block"><rect x="982" y="287" width="208" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="1086" y="310" font-size="12.5" font-weight="700" fill="#497992" text-anchor="middle">04</text><text x="1086" y="336" font-size="14.4" font-weight="700" fill="#173453" text-anchor="middle">Explain Limits</text><text x="1086" y="358" font-size="12.4" fill="#506C7E" text-anchor="middle">Rare-class weaknesses</text><text x="1086" y="378" font-size="12.4" fill="#506C7E" text-anchor="middle">Small participant count</text><text x="1086" y="398" font-size="12.4" fill="#506C7E" text-anchor="middle">No clinical validity claim</text></g><g class="process-block"><rect x="1218" y="287" width="208" height="132" rx="15" fill="white" stroke="#B8CFDE" stroke-width="1.8"/><text x="1322" y="310" font-size="12.5" font-weight="700" fill="#497992" text-anchor="middle">05</text><text x="1322" y="336" font-size="14.4" font-weight="700" fill="#173453" text-anchor="middle">Export Reports</text><text x="1322" y="358" font-size="12.4" fill="#506C7E" text-anchor="middle">Evidence tables and plots</text><text x="1322" y="378" font-size="12.4" fill="#506C7E" text-anchor="middle">Source-grounded manifest</text><text x="1322" y="398" font-size="12.4" fill="#506C7E" text-anchor="middle">No new predictions</text></g><g class="process-block"><rect x="1454" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="1558" y="310" font-size="12.5" font-weight="700" fill="#A7E9DF" text-anchor="middle">OUTPUT</text><text x="1558" y="336" font-size="14.4" font-weight="700" fill="#FFFFFF" text-anchor="middle">Quality Gate</text><text x="1558" y="358" font-size="12.4" fill="#DFEDF4" text-anchor="middle">Checked saved outputs</text><text x="1558" y="378" font-size="12.4" fill="#DFEDF4" text-anchor="middle">Research summary</text><text x="1558" y="398" font-size="12.4" fill="#DFEDF4" text-anchor="middle">Reproducibility report</text></g></g>
