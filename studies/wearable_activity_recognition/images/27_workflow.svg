<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">HARTH Stage 27: Final Research Evidence Synthesis and Reproducibility</title>
<desc id="desc">Stage 27 audits the recorded HARTH Development and previously approved same-study held-out results from earlier notebooks, verifies the versioned protocol, summarises seven-model and multiseed evidence, and exports source-grounded reports. It performs no model training, raw Test access or new predictions; retrospective qualified Test performance is not blind external validation.</desc>
<defs><marker id="small-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs>
