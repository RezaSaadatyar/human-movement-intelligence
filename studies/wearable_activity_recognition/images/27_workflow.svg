<g><text x="338" y="115" font-size="15" font-weight="700" fill="#173453">Source and Signal Context</text><text x="338" y="145" font-size="13.1" fill="#173453">HARTH v2.0 · six accel. axes</text><text x="338" y="167" font-size="13.1" fill="#173453">Lower-back + thigh · 50 Hz</text><text x="338" y="189" font-size="13.1" fill="#173453">100 samples / source window</text><text x="338" y="220" font-size="11.4" fill="#54738A">29 Development people · 14,201 windows</text></g>
<g><text x="658" y="115" font-size="15" font-weight="700" fill="#173453">Evidence Included</text><text x="658" y="145" font-size="13.1" fill="#173453">Stage 23 · 7 Development models</text><text x="658" y="167" font-size="13.1" fill="#173453">Stage 24 · 36 seed/loss jobs</text><text x="658" y="189" font-size="13.1" fill="#173453">Stage 25 · approved selection</text><text x="658" y="220" font-size="11.4" fill="#54738A">Stage 26 · two frozen model scores</text></g>
<g><text x="985" y="115" font-size="15" font-weight="700" fill="#173453">Evidence Governance</text><text x="985" y="145" font-size="13.1" fill="#173453">Read-only saved outputs</text><text x="985" y="167" font-size="13.1" fill="#173453">No source Test CSVs or weights</text><text x="985" y="189" font-size="13.1" fill="#173453">Versioned provenance and limits</text><text x="985" y="220" font-size="11.4" fill="#54738A">Source-reported display precision</text></g><g><text x="1272" y="115" font-size="14" font-weight="700" fill="#173453">VERIFIED RESEARCH SUMMARY</text><text x="1274" y="145" font-size="12" fill="#173453">ResNet · qualified Macro F1</text><text x="1658" y="145" font-size="12.3" font-weight="700" fill="#173453" text-anchor="end">0.7182</text><text x="1274" y="166" font-size="12" fill="#173453">Random Forest · qualified F1</text><text x="1658" y="166" font-size="12.3" font-weight="700" fill="#173453" text-anchor="end">0.6817</text><text x="1274" y="187" font-size="12" fill="#173453">Original Test participants</text><text x="1658" y="187" font-size="12.3" fill="#173453" text-anchor="end">2</text><text x="1274" y="208" font-size="12" fill="#173453">New models or Test runs</text><text x="1658" y="208" font-size="12.3" fill="#173453" text-anchor="end">0</text><text x="1274" y="232" font-size="11.4" fill="#54738A">Qualified same-study Test; not fully blind</text></g>
