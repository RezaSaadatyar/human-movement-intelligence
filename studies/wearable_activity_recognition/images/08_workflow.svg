<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">HARTH Stage 08 | Full Development-Cohort Source and Fold Audit</title>
<desc id="desc">Twenty-nine HARTH v2.0 Development subjects, excluding original reserved Test subjects S023 and S032. Source inventory precedes preparation of 132397 eligible two-second windows and 30 statistical features per sample. Five subject-disjoint folds have complete Train and Validation task-class coverage. This stage performs no classifier fitting or Test scoring.</desc>
