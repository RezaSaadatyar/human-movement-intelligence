<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">HARTH Notebook 05: Classical ML Baselines, Validation Only</title>
<desc id="figure-description">Eight participants with lower-back and thigh accelerometers produce a restricted eight-class feature matrix and a subject-disjoint four-train, two-validation, two-reserved-Test split. Dummy, Logistic Regression and Random Forest are compared on Validation using Macro F1. Final Test remains unscored.</desc>
<defs><marker id="small-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs>
<rect width="1700" height="480" rx="20" fill="#F4F9FD"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
 <text x="30" y="38" font-size="23" font-weight="700" fill="#173453">STAGE 05 | CLASSICAL ML BASELINES</text>
 <text x="30" y="67" font-size="15" fill="#54738A">Eight documented activity classes · Participant-disjoint exploratory baseline · Validation only, no final Test inference</text>
 <rect x="24" y="84" width="1652" height="160" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
 <rect x="24" y="262" width="1652" height="174" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>

 <g aria-label="Professional rear-view body schematic of wearable sensor placement">
  <text x="50" y="105" font-size="11.5" font-weight="700" fill="#53738A">REAR-VIEW SENSOR PLACEMENT</text>
  <g stroke="#7298B0" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
   <circle cx="95" cy="128" r="12" fill="#FFFFFF"/>
   <path d="M91 140 L91 147 M99 140 L99 147" fill="none"/>
   <path d="M77 149 Q95 143 113 149 L116 174 Q109 187 95 189 Q81 187 74 174 Z" fill="#D9E7F1"/>
   <path d="M77 153 L65 178 L67 193 M113 153 L125 178 L123 193" fill="none"/>
   <path d="M84 189 L80 213 L79 226 M106 189 L111 214 L112 226" fill="none"/>
   <path d="M79 226 L88 227 M112 226 L120 227" fill="none"/>
  </g>
  <rect x="86" y="171" width="18" height="11" rx="2.5" fill="#245E9D" stroke="#FFFFFF" stroke-width="1.3"/>
  <rect x="77" y="199" width="16" height="11" rx="2.5" fill="#22A0A0" stroke="#FFFFFF" stroke-width="1.3"/>
  <path d="M104 176 H140" stroke="#245E9D" stroke-width="1.5"/><text x="146" y="180" font-size="12.8" fill="#173453">Lower back</text>
  <path d="M93 204 H140" stroke="#15938F" stroke-width="1.5"/><text x="146" y="208" font-size="12.8" fill="#173453">Thigh</text>
 </g>
 <g>
  <text x="338" y="115" font-size="15" font-weight="700" fill="#173453">Eight HARTH Participants</text>
  <text x="338" y="145" font-size="13.5" fill="#506C7E">S023 · S024 · S025 · S027</text>
  <text x="338" y="167" font-size="13.5" fill="#506C7E">S028 · S032 · S034 · S035</text>
  <text x="338" y="189" font-size="13.5" fill="#506C7E">Six axes · 50 Hz · 30 features</text>
 </g>
 <g>
  <text x="648" y="115" font-size="15" font-weight="700" fill="#173453">Activity and Split Controls</text>
  <text x="648" y="145" font-size="13.5" fill="#506C7E">24,563 eight-class windows</text>
  <text x="648" y="167" font-size="13.5" fill="#506C7E">4 Train / 2 Validation / 2 Test</text>
  <text x="648" y="189" font-size="13.5" fill="#506C7E">Undocumented codes excluded</text>
 </g>
 <g>
  <text x="985" y="115" font-size="15" font-weight="700" fill="#173453">Model Comparison</text>
  <text x="985" y="145" font-size="13.5" fill="#506C7E">Dummy (most frequent)</text>
  <text x="985" y="167" font-size="13.5" fill="#506C7E">Train-only scaled Logistic Reg.</text>
  <text x="985" y="189" font-size="13.5" fill="#506C7E">Unscaled Random Forest</text>
 </g>
 <g aria-label="Recorded Validation Macro F1 scores only">
  <text x="1325" y="115" font-size="14" font-weight="700" fill="#173453">VALIDATION MACRO F1</text>
  <rect x="1336" y="133" width="8" height="12" rx="2" fill="#8793B0"/><text x="1472" y="143" font-size="12.2" fill="#173453">0.0592  Dummy</text>
<rect x="1336" y="158" width="108" height="12" rx="2" fill="#245E9D"/><text x="1472" y="168" font-size="12.2" fill="#173453">0.8343  Logistic Regression</text>
<rect x="1336" y="183" width="98" height="12" rx="2" fill="#22A0A0"/><text x="1472" y="193" font-size="12.2" fill="#173453">0.7563  Random Forest</text>
  <text x="1325" y="229" font-size="11.8" fill="#54738A">Descriptive eight-person pilot; final Test not scored</text>
 </g>
 <g aria-label="Six uniform short right-facing process arrows"><path d="M252 353 H266" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/>
<path d="M488 353 H502" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/>
<path d="M724 353 H738" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/>
<path d="M960 353 H974" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/>
<path d="M1196 353 H1210" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/>
<path d="M1432 353 H1446" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/></g>
 <g aria-label="Seven source-grounded sequential research blocks"><g class="process-block">
  <rect x="38" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/>
  <text x="142" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A7E9DF">INPUT</text>
  <text x="142" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">HARTH v2.0</text>
  <text x="142" y="358" text-anchor="middle" font-size="12.6" fill="#DFEDF4">8 source participants</text>
  <text x="142" y="378" text-anchor="middle" font-size="12.6" fill="#DFEDF4">Back + thigh sensors</text>
  <text x="142" y="398" text-anchor="middle" font-size="12.6" fill="#DFEDF4">6-axis acceleration</text>
 </g>
<g class="process-block">
  <rect x="274" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
  <text x="378" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">01</text>
  <text x="378" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Load &amp; Window</text>
  <text x="378" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">50 Hz · 2-second windows</text>
  <text x="378" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Pure labels · no gaps</text>
  <text x="378" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">30 statistical features</text>
 </g>
<g class="process-block">
  <rect x="510" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
  <text x="614" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">02</text>
  <text x="614" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Define 8 Classes</text>
  <text x="614" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">Keep codes 1–8</text>
  <text x="614" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Exclude other labels</text>
  <text x="614" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">24,563 valid windows</text>
 </g>
<g class="process-block">
  <rect x="746" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
  <text x="850" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">03</text>
  <text x="850" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Group Partition</text>
  <text x="850" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">4 Train · 2 Validation</text>
  <text x="850" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">2 Test participants</text>
  <text x="850" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Seed 42 · no overlap</text>
 </g>
<g class="process-block">
  <rect x="982" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
  <text x="1086" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">04</text>
  <text x="1086" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Train Baselines</text>
  <text x="1086" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">Dummy · Logistic Reg.</text>
  <text x="1086" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Random Forest</text>
  <text x="1086" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Fit Train only</text>
 </g>
<g class="process-block">
  <rect x="1218" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
  <text x="1322" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">05</text>
  <text x="1322" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Validation Audit</text>
  <text x="1322" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">Macro F1 ranking</text>
  <text x="1322" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Per-class diagnostics</text>
  <text x="1322" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Confusion matrix</text>
 </g>
<g class="process-block">
  <rect x="1454" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/>
  <text x="1558" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A7E9DF">OUTPUT</text>
  <text x="1558" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Quality Gate</text>
  <text x="1558" y="358" text-anchor="middle" font-size="12.6" fill="#DFEDF4">Best: Logistic Reg.</text>
  <text x="1558" y="378" text-anchor="middle" font-size="12.6" fill="#DFEDF4">Macro F1 = 0.8343</text>
  <text x="1558" y="398" text-anchor="middle" font-size="12.6" fill="#DFEDF4">Final Test not scored</text>
 </g></g>
 <text x="30" y="466" font-size="13.2" fill="#54738A">Source signals → time-safe features → fixed activity task → subject-disjoint partitions → classical models → validation diagnostics → scientific quality gate</text>
</g>
</svg>
