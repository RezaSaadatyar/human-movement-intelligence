idth="196" height="140" rx="15" fill="white" stroke="#B9CEDF" stroke-width="2"/><text x="1240" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#426F89">05</text><text x="1240" y="141" text-anchor="middle" font-size="14" font-weight="600" fill="#173453">Compare class support</text><text x="1240" y="164" text-anchor="middle" font-size="16" font-weight="600" fill="#173453">and participant</text><text x="1240" y="187" text-anchor="middle" font-size="16" font-weight="600" fill="#173453">performance</text></g><g><rect x="1366" y="97" width="196" height="140" rx="15" fill="#173453" stroke="#173453" stroke-width="2"/><text x="1464" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#B6F0E7">OUTPUT</text><text x="1464" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="white">Five-fold baseline CV</text></g></g><text x="28" y="270" font-family="DejaVu Sans, Arial, sans-serif" font-size="14" fill="#54738A">Original executable statements and saved evidence are retained</text></svg>
