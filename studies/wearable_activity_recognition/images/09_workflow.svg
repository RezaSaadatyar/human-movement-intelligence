<svg xmlns="http://www.w3.org/2000/svg" width="1610" height="293" viewBox="0 0 1610 293" role="img" aria-labelledby="title desc"><title id="title">Notebook 9: horizontal scientific workflow</title><desc id="desc">29-person source cohort to Import existing reusable methods to Audit every fold before training to Run the three model families across all five folds to Compare the two leading models on identical participants to Compare class support and participant performance to Five-fold baseline CV</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#4C879D"/></marker></defs><rect width="1610" height="293" rx="20" fill="#F3F8FC"/><text x="28" y="38" font-family="DejaVu Sans, Arial, sans-serif" font-weight="700" font-size="22" fill="#173453">HARTH  |  NOTEBOOK 09  |  RESEARCH WORKFLOW</text><text x="28" y="69" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" fill="#54738A">Participant-aware source processing, analysis and transparent outputs</text><g font-family="DejaVu Sans, Arial, sans-serif"><path d="M224 167 H241" stroke="#4C879D" stroke-width="3" marker-end="url(#a)"/><path d="M448 167 H465" stroke="#4C879D" stroke-width="3" marker-end="url(#a)"/><path d="M672 167 H689" stroke="#4C879D" stroke-width="3" marker-end="url(#a)"/><path d="M896 167 H913" stroke="#4C879D" stroke-width="3" marker-end="url(#a)"/><path d="M1120 167 H1137" stroke="#4C879D" stroke-width="3" marker-end="url(#a)"/><path d="M1344 167 H1361" stroke="#4C879D" stroke-width="3" marker-end="url(#a)"/><g><rect x="22" y="97" width="196" height="140" rx="15" fill="#173453" stroke="#173453" stroke-width="2"/><text x="120" y="123" text-anchor="middle" font-size="13" font-weight="700" fill="#B6F0E7">INPUT</text><text x="120" y="153" text-anchor="middle" font-size="16" font-weight="600" fill="white">29-person source</text><text x="120" y="176" text-anchor="middle" font-size="16" font-weight="600" fill="white">cohort</text><