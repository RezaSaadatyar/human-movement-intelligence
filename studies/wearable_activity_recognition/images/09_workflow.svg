<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">HARTH Notebook 09: Full Development Grouped Cross-Validation</title>
<desc id="desc">An illustrated research workflow for 29 HARTH Development participants, 132397 label-pure windows and 30 statistical features. Five group-held-out folds compare Dummy, Logistic Regression and Random Forest. A paired Random Forest minus Logistic Regression analysis is performed across the same 29 Development subjects. S023 and S032 are excluded from this Notebook; no independent final Test inference or clinical claims are made.</desc>
<defs><marker id="small-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs>
