 </g>
 <g>
  <text x="338" y="115" font-size="15" font-weight="700" fill="#173453">Wearable Signal Inputs</text>
  <text x="338" y="145" font-size="13.5" fill="#506C7E">HARTH v2.0 · 50 Hz</text>
  <text x="338" y="167" font-size="13.5" fill="#506C7E">Six raw acceleration channels</text>
  <text x="338" y="189" font-size="13.5" fill="#506C7E">100 points / window · 2 s</text>
 </g>
 <g>
  <text x="650" y="115" font-size="15" font-weight="700" fill="#173453">Bounded Cohort and Split</text>
  <text x="650" y="145" font-size="13.5" fill="#506C7E">14,201 capped signal windows</text>
  <text x="650" y="167" font-size="13.5" fill="#506C7E">Train: 20 people / 10,000 windows</text>
  <text x="650" y="189" font-size="13.5" fill="#506C7E">Val: 6 / 2,701 · Unused Dev: 3</text>
 </g>
 <g>
  <text x="986" y="115" font-size="15" font-weight="700" fill="#173453">Leakage-Aware Training</text>
