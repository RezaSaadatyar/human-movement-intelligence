  <text x="1600" y="171" text-anchor="middle" font-size="10.8" fill="#506C7E">Class scores</text>
  <text x="1280" y="212" font-size="12" fill="#54738A">Observed final Validation Macro F1: 0.6659</text>
  <text x="1280" y="230" font-size="11.5" fill="#54738A">Bounded pilot; not comparable to full-cohort classical CV</text>
 </g>
