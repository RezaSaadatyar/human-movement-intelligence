<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="816" viewBox="0 0 1700 816" role="img" aria-labelledby="title desc">
<title id="title">NinaPro DB2: frozen person-independent multimodal evaluation</title>
<desc id="desc">Five-band editable workflow for the fixed Development-selected B1_rf sEMG comparator and F1_rf early-fusion Random Forest; both are refitted on 35 Development participants and evaluated once on five reserved Test participants. The schematic contains no Test results.</desc>
