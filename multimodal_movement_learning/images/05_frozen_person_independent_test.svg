<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" font-family="DejaVu Sans, Arial, sans-serif">
<title>Frozen model comparison on previously unseen participants</title>
<desc>Development-selected recipes to all-Development refits to reserved Test evaluation. Offline within-dataset generalisation is measured; findings do not establish online prosthetic or clinical performance.</desc>
<rect width="1700" height="480" fill="#F4F9FD"/>
<text x="40" y="46" fill="#173453" font-size="26" font-weight="bold"><tspan x="40" dy="0">Frozen model comparison on previously unseen participants</tspan></text>
<rect x="40" y="73" width="1620" height="108" rx="15" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<text x="62" y="110" fill="#173453" font-size="18" font-weight="bold"><tspan x="62" dy="0">Development-selected recipes to all-Development refits to reserved Test evaluation</tspan></text>
<text x="62" y="150" fill="#506C7E" font-size="15" font-weight="normal"><tspan x="62" dy="0">Model choice and neural epoch count are fixed from Development before the labels of reserved people enter scoring</tspan></text>
<rect x="40" y="202" width="1620" height="210" rx="15" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<rect x="56" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="72" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="72" dy="0">Frozen recipes</tspan></text>
<text x="72" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="72" dy="0">Unimodal comparator</tspan><tspan x="72" dy="24">Fusion comparator</tspan></text>
<path d="M359 305 h15" stroke="#245E9D" stroke-width="3" stroke-linecap="round"/>
<path d="M368 298 l8 7 -8 7" stroke="#245E9D" stroke-width="3" fill="none" stroke-linejoin="round"/>
<rect x="382" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="398" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="398" dy="0">Development refits</tspan></text>
<text x="398" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="398" dy="0">Fixed preprocessing</tspan><tspan x="398" dy="24">Selected training epochs</tspan></text>
<path d="M685 305 h15" stroke="#245E9D" stroke-width="3" stroke-linecap="round"/>
<path d="M694 298 l8 7 -8 7" stroke="#245E9D" stroke-width="3" fill="none" stroke-linejoin="round"/>
<rect x="708" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="724" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="724" dy="0">Held-out predictions</tspan></text>
<text x="724" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="724" dy="0">Same paired Test windows</tspan><tspan x="724" dy="24">Fixed source classes</tspan></text>
<path d="M1011 305 h15" stroke="#245E9D" stroke-width="3" stroke-linecap="round"/>
<path d="M1020 298 l8 7 -8 7" stroke="#245E9D" stroke-width="3" fill="none" stroke-linejoin="round"/>
<rect x="1034" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="1050" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="1050" dy="0">Independent outcomes</tspan></text>
<text x="1050" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="1050" dy="0">Per-person macro F1</tspan><tspan x="1050" dy="24">Paired uncertainty</tspan></text>
<path d="M1337 305 h15" stroke="#245E9D" stroke-width="3" stroke-linecap="round"/>
<path d="M1346 298 l8 7 -8 7" stroke="#245E9D" stroke-width="3" fill="none" stroke-linejoin="round"/>
<rect x="1360" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="1376" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="1376" dy="0">Scientific interpretation</tspan></text>
<text x="1376" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="1376" dy="0">Class-specific errors</tspan><tspan x="1376" dy="24">Measured CPU cost</tspan></text>
<text x="40" y="448" fill="#54738A" font-size="15" font-weight="normal"><tspan x="40" dy="0">Offline within-dataset generalisation is measured; findings do not establish online prosthetic or clinical performance.</tspan></text>
