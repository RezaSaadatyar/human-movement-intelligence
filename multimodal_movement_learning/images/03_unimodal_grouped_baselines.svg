<text x="398" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="398" dy="0">sEMG models</tspan></text>
<text x="398" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="398" dy="0">Logistic Regression / RF</tspan><tspan x="398" dy="24">CNN / TCN / BiGRU</tspan></text>
<path d="M685 305 h15" stroke="#245E9D" stroke-width="3" stroke-linecap="round"/>
