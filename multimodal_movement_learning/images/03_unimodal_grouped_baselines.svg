<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" font-family="DejaVu Sans, Arial, sans-serif">
<title>Unimodal source-specific and learned temporal representations</title>
<desc>Development participants to matched grouped folds to classical and temporal classifiers. Model selection uses Development evidence; internal stopping subsets remain inside each Training fold.</desc>
<rect width="1700" height="480" fill="#F4F9FD"/>
<text x="40" y="46" fill="#173453" font-size="26" font-weight="bold"><tspan x="40" dy="0">Unimodal source-specific and learned temporal representations</tspan></text>
<rect x="40" y="73" width="1620" height="108" rx="15" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<text x="62" y="110" fill="#173453" font-size="18" font-weight="bold"><tspan x="62" dy="0">Development participants to matched grouped folds to classical and temporal classifiers</tspan></text>
<text x="62" y="150" fill="#506C7E" font-size="15" font-weight="normal"><tspan x="62" dy="0">Every model uses the same window identities and fixed corrected E1 class set; Test people remain outside fitting</tspan></text>
<rect x="40" y="202" width="1620" height="210" rx="15" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<rect x="56" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="72" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="72" dy="0">Development folds</tspan></text>
<text x="72" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="72" dy="0">Person-independent CV</tspan><tspan x="72" dy="24">Training-only scaling</tspan></text>
<path d="M359 305 h15" stroke="#245E9D" stroke-width="3" stroke-linecap="round"/>
<path d="M368 298 l8 7 -8 7" stroke="#245E9D" stroke-width="3" fill="none" stroke-linejoin="round"/>
