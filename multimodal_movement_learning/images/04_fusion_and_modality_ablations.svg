<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="870" viewBox="0 0 1700 870" role="img" aria-labelledby="title desc">
<title id="title">Multimodal movement learning: parallel fusion models and grouped Development comparison</title>
<desc id="desc">Five-band scientific schematic: paired NinaPro DB2 E1 recordings, parallel classical and neural fusion arms, participant-disjoint grouped validation, synthetic acceleration-perturbation diagnostics and Development-only model selection. No measured fusion benefit or Test result is depicted.</desc>
<defs>
<style>
text{font-family:"DejaVu Sans",Arial,sans-serif}
.big{font-size:25px;font-weight:700;fill:#173453}
.sub{font-size:14px;fill:#506C7E}
.band{font-size:14px;font-weight:700;fill:#245E9D}
.heading{font-size:17px;font-weight:700;fill:#173453}
.body{font-size:13.8px;fill:#506C7E}
.whiteheading{font-size:17px;font-weight:700;fill:#fff}
.whitebody{font-size:13px;fill:#EAF3FA}
.note{font-size:12.5px;fill:#506C7E}
</style>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
<path d="M0 0 L8 4 L0 8Z" fill="#245E9D"/>
</marker>
</defs>
<rect x="0" y="0" width="1700" height="870" rx="18" fill="#F4F9FD"/>
<text x="48" y="49" class="big">BAND 0 | NINAPRO DB2: MULTIMODAL MOVEMENT FUSION</text>
<text x="48" y="80" class="sub">Aligned sEMG and acceleration · Independent classical and learned fusion arms · Development-only comparison</text>
<rect x="34" y="100" width="1632" height="159" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<text x="56" y="127" class="band">BAND 1 | PAIRED INPUTS AND PARTICIPANT BOUNDARY</text>
<rect x="56" y="145" width="490" height="92" rx="12" fill="#FFFFFF" stroke="#B8CFDE"/>
<text x="76" y="173" class="heading">Common source windows</text>
<text x="76" y="196" class="body">E1 · 40,000 paired windows · labels 0–17</text>
<text x="76" y="217" class="body">Same person, recording interval and source-row key</text>
<rect x="566" y="145" width="490" height="92" rx="12" fill="#FFFFFF" stroke="#B8CFDE"/>
<text x="586" y="173" class="heading">Two sensor representations</text>
<text x="586" y="196" class="body">12-channel sEMG · 48 summary features</text>
<text x="586" y="217" class="body">36-column acceleration · 96 summary features</text>
<rect x="1076" y="145" width="566" height="92" rx="12" fill="#FFFFFF" stroke="#B8CFDE"/>
<text x="1096" y="173" class="heading">Independent person assignments</text>
<text x="1096" y="196" class="body">35 Development people · five folds of seven</text>
<text x="1096" y="217" class="body">Five reserved Test people excluded from selection</text>
<rect x="34" y="276" width="1632" height="280" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<text x="56" y="303" class="band">BAND 2 | INDEPENDENT FUSION METHODS (PARALLEL ARMS)</text>
<g stroke="#B8CFDE" fill="#FFFFFF" stroke-width="2">
<rect x="54" y="329" width="382" height="199" rx="12"/>
<rect x="457" y="329" width="382" height="199" rx="12"/>
<rect x="860" y="329" width="382" height="199" rx="12"/>
<rect x="1263" y="329" width="382" height="199" rx="12"/>
</g>
<text x="74" y="365" class="heading">F1 | Early feature fusion</text>
<text x="74" y="392" class="body">Concatenate 48 + 96 statistics</text>
<text x="74" y="418" class="body">Logistic Regression and Random Forest</text>
<text x="74" y="445" class="body">Training-only fitted feature pipeline</text>
<text x="74" y="485" class="note">Same source windows and fixed classes</text>
<text x="477" y="365" class="heading">F2 / F4 | Decision fusion</text>
<text x="477" y="392" class="body">Fixed 0.5 / 0.5 class probabilities</text>
<text x="477" y="418" class="body">Classical and selected neural branches</text>
<text x="477" y="445" class="body">Real Notebook 03 OOF probabilities</text>
<text x="477" y="485" class="note">No Validation-tuned fusion weights</text>
<text x="880" y="365" class="heading">F3 | Dual-branch encoders</text>
<text x="880" y="392" class="body">Paired CNN or residual TCN encoders</text>
<text x="880" y="418" class="body">Concatenated learned embeddings</text>
<text x="880" y="445" class="body">Joint fixed-class classification head</text>
<text x="880" y="485" class="note">Training-only checkpoint selection</text>
<text x="1283" y="365" class="heading">F5 | Learned interaction</text>
<text x="1283" y="392" class="body">Gated or compact cross-attention</text>
<text x="1283" y="418" class="body">Separate modality-specific encoders</text>
<text x="1283" y="445" class="body">No large-scale pretrained model</text>
<text x="1283" y="485" class="note">No causal explanation claim</text>
