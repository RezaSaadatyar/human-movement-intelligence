<rect x="34" y="594" width="1632" height="156" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<text x="56" y="622" class="band">BAND 3 | MATCHED DEVELOPMENT EVALUATION AND DIAGNOSTICS</text>
<rect x="55" y="640" width="495" height="88" rx="11" fill="#FFFFFF" stroke="#B8CFDE"/>
<text x="75" y="671" class="heading">Five participant-disjoint folds</text>
<text x="75" y="696" class="body">28 Training / 7 Validation people in each fold</text>
<rect x="569" y="640" width="495" height="88" rx="11" fill="#FFFFFF" stroke="#B8CFDE"/>
<text x="589" y="671" class="heading">Participant-balanced recognition</text>
<text x="589" y="696" class="body">Fixed-18-class macro F1 and paired differences</text>
<rect x="1083" y="640" width="561" height="88" rx="11" fill="#FFFFFF" stroke="#B8CFDE"/>
<text x="1103" y="671" class="heading">Synthetic acceleration perturbations</text>
<text x="1103" y="696" class="body">Mean replacement: all, one sensor or time gap</text>
<rect x="34" y="767" width="1632" height="68" rx="14" fill="#245E9D"/>
<text x="55" y="795" class="whiteheading">BAND 4 | DEVELOPMENT-SELECTED COMPARATOR AND FUSION RECIPE</text>
<text x="55" y="820" class="whitebody">Aligned OOF probabilities · Per-person fusion minus unimodal scores · Frozen selection for separate Notebook 05 Test</text>
<text x="48" y="856" class="note">Scientific workflow schematic: no fusion gain, independent Test score or real-world sensor-failure outcome is asserted.</text>
