<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" font-family="DejaVu Sans, Arial, sans-serif">
<title>Matched multimodal fusion and sensor-information comparison</title>
<desc>Paired Development windows to early/late and learned fusion to measured person-level differences. Artificial channel replacement assesses perturbation response, not physical sensor-removal validity.</desc>
<rect width="1700" height="480" fill="#F4F9FD"/>
<text x="40" y="46" fill="#173453" font-size="26" font-weight="bold"><tspan x="40" dy="0">Matched multimodal fusion and sensor-information comparison</tspan></text>
<rect x="40" y="73" width="1620" height="108" rx="15" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<text x="62" y="110" fill="#173453" font-size="18" font-weight="bold"><tspan x="62" dy="0">Paired Development windows to early/late and learned fusion to measured person-level differences</tspan></text>
<text x="62" y="150" fill="#506C7E" font-size="15" font-weight="normal"><tspan x="62" dy="0">A single source window contributes one sEMG branch and one acceleration branch with the same class and person identifiers</tspan></text>
<rect x="40" y="202" width="1620" height="210" rx="15" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<rect x="56" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="72" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="72" dy="0">Paired inputs</tspan></text>
<text x="72" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="72" dy="0">Fixed source labels</tspan><tspan x="72" dy="24">Common participant folds</tspan></text>
<path d="M359 305 h15" stroke="#245E9D" stroke-width="3" stroke-linecap="round"/>
<path d="M368 298 l8 7 -8 7" stroke="#245E9D" stroke-width="3" fill="none" stroke-linejoin="round"/>
<rect x="382" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="398" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="398" dy="0">Classical fusion</tspan></text>
<text x="398" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="398" dy="0">Feature concatenation</tspan><tspan x="398" dy="24">Equal-weight probability</tspan></text>
<path d="M685 305 h15" stroke="#245E9D" stroke-width="3" stroke-linecap="round"/>
<path d="M694 298 l8 7 -8 7" stroke="#245E9D" stroke-width="3" fill="none" stroke-linejoin="round"/>
<rect x="708" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="724" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="724" dy="0">Learned fusion</tspan></text>
<text x="724" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="724" dy="0">Two-branch CNN / TCN</tspan><tspan x="724" dy="24">Joint embedding head</tspan></text>
<path d="M1011 305 h15" stroke="#245E9D" stroke-width="3" stroke-linecap="round"/>
<path d="M1020 298 l8 7 -8 7" stroke="#245E9D" stroke-width="3" fill="none" stroke-linejoin="round"/>
<rect x="1034" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="1050" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="1050" dy="0">Cross-modal weights</tspan></text>
<text x="1050" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="1050" dy="0">Gated features</tspan><tspan x="1050" dy="24">Compact cross-attention</tspan></text>
<path d="M1337 305 h15" stroke="#245E9D" stroke-width="3" stroke-linecap="round"/>
<path d="M1346 298 l8 7 -8 7" stroke="#245E9D" stroke-width="3" fill="none" stroke-linejoin="round"/>
<rect x="1360" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="1376" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="1376" dy="0">Evaluation and stress</tspan></text>
<text x="1376" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="1376" dy="0">Paired subject differences</tspan><tspan x="1376" dy="24">Simulated sensor gaps</tspan></text>
<text x="40" y="448" fill="#54738A" font-size="15" font-weight="normal"><tspan x="40" dy="0">Artificial channel replacement assesses perturbation response, not physical sensor-removal validity.</tspan></text>
</svg>