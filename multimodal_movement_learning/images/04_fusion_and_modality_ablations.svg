<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="816" viewBox="0 0 1700 816" role="img" aria-labelledby="title desc">
<title id="title">NinaPro DB2 participant-grouped multimodal fusion</title>
<desc id="desc">Five-band editable scientific workflow. Source-aligned forearm sEMG and tri-axial accelerometry support parallel classical early and fixed-weight late fusion, learned dual-encoder and interaction models, with five Development participant-disjoint folds and synthetic acceleration perturbation analyses. No independent Test performance or fusion benefit is asserted.</desc>
