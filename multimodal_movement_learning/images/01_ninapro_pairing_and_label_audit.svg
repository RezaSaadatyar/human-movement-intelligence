<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="816" viewBox="0 0 1700 816" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, Arial, sans-serif"><title id="title">NINAPRO DB2: ORIGINAL SIGNALS, ANNOTATIONS AND SOURCE EVIDENCE</title><desc id="desc">Three-part research workflow: acquisition of an original participant source archive, independent inspection of the two synchronised modalities and corrected annotations, and export of source evidence for further analysis. The values refer to observed S01 E1 notebook outputs and not estimated model performance.</desc><defs><marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#245E9D"/></marker><marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#237B65"/></marker></defs><rect width="1700" height="816" rx="18" fill="#F4F9FD"/><text x="34" y="41" fill="#173453" font-size="24" font-weight="700">NINAPRO DB2: ORIGINAL SIGNALS, ANNOTATIONS AND SOURCE EVIDENCE</text><text x="34" y="72" fill="#54738A" font-size="15" font-weight="400">Published hand-movement dataset  ·  One original E1 participant recording  ·  Paired sEMG and acceleration</text><line x1="30" y1="86" x2="1670" y2="86" stroke="#D9E8F1" stroke-width="2"/><rect x="24" y="102" width="1652" height="206" rx="16" fill="#EAF3FA" stroke="#245E9D" stroke-opacity="0.24" stroke-width="1.5"/><rect x="24" y="102" width="10" height="206" rx="5" fill="#245E9D"/><text x="52" y="128" fill="#245E9D" font-size="16.4" font-weight="700">SOURCE AND MEASUREMENTS</text><text x="52" y="150" fill="#54738A" font-size="13.9" font-weight="400">Read the original distributed files and document both sensing modalities.</text><rect x="50" y="167" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="50" y="167" width="6" height="126" rx="3" fill="#245E9D"/><text x="68" y="193" fill="#173453" font-size="16.3" font-weight="700">Original participant archive</text><g transform="translate(359,182)" stroke="#245E9D" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1 H20 L30 11 V39 H2Z"/><path d="M20 1 V11 H30"/><path d="M8 20 H23 M8 27 H22 M8 34 H18"/></g><text x="68" y="221" fill="#506C7E" font-size="14.1" font-weight="400">S01 ZIP: 448.47 MiB</text><text x="68" y="244" fill="#506C7E" font-size="14.1" font-weight="400">Three exercise MATLAB files</text><text x="68" y="282" fill="#245E9D" font-size="12.7" font-weight="600">Original acquisition</text><line x1="420" y1="232" x2="452" y2="232" stroke="#245E9D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#blue-arrow)"/><rect x="465" y="167" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="465" y="167" width="6" height="126" rx="3" fill="#245E9D"/><text x="483" y="193" fill="#173453" font-size="16.3" font-weight="700">Exercise E1: hand motion</text><g transform="translate(774,182)" stroke="#245E9D" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 1 H20 L30 11 V39 H2Z"/><path d="M20 1 V11 H30"/><path d="M8 20 H23 M8 27 H22 M8 34 H18"/></g><text x="483" y="221" fill="#506C7E" font-size="14.1" font-weight="400">S1_E1_A1.mat</text><text x="483" y="244" fill="#506C7E" font-size="14.1" font-weight="400">Common released sample index</text><text x="483" y="282" fill="#245E9D" font-size="12.7" font-weight="600">Finger-movement protocol</text><line x1="835" y1="232" x2="867" y2="232" stroke="#245E9D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#blue-arrow)"/><rect x="880" y="167" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="880" y="167" width="6" height="126" rx="3" fill="#245E9D"/><text x="898" y="193" fill="#173453" font-size="16.3" font-weight="700">Paired sensor channels</text><g transform="translate(1189,182)" stroke="#245E9D" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="28" height="30" rx="6"/><path d="M6 17 H11 L14 10 L18 27 L22 19 H27"/></g><text x="898" y="221" fill="#506C7E" font-size="14.1" font-weight="400">12 sEMG columns</text><text x="898" y="244" fill="#506C7E" font-size="14.1" font-weight="400">36 acceleration columns</text><text x="898" y="282" fill="#245E9D" font-size="12.7" font-weight="600">Same source intervals</text><line x1="1250" y1="232" x2="1282" y2="232" stroke="#245E9D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#blue-arrow)"/><rect x="1295" y="167" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="1295" y="167" width="6" height="126" rx="3" fill="#245E9D"/><text x="1313" y="193" fill="#173453" font-size="16.3" font-weight="700">Released E1 observation</text><g transform="translate(1604,182)" stroke="#245E9D" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="20" r="16"/><path d="M18 8 V20 H27"/></g><text x="1313" y="221" fill="#506C7E" font-size="14.1" font-weight="400">1,808,331 recorded rows</text><text x="1313" y="244" fill="#506C7E" font-size="14.1" font-weight="400">904.17 s nominal duration</text><text x="1313" y="282" fill="#245E9D" font-size="12.7" font-weight="600">Released grid: 2,000 Hz</text><rect x="24" y="322" width="1652" height="206" rx="16" fill="#EDF8F1" stroke="#237B65" stroke-opacity="0.24" stroke-width="1.5"/><rect x="24" y="322" width="10" height="206" rx="5" fill="#237B65"/><text x="52" y="348" fill="#237B65" font-size="16.4" font-weight="700">SOURCE QUALITY AND LABEL ANNOTATIONS</text><text x="52" y="370" fill="#54738A" font-size="13.9" font-weight="400">Check source arrays, code boundaries and repetition identities.</text><rect x="50" y="387" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="50" y="387" width="6" height="126" rx="3" fill="#237B65"/><text x="68" y="413" fill="#173453" font-size="16.3" font-weight="700">Sensor-row correspondence</text><g transform="translate(359,402)" stroke="#237B65" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="17" cy="19" r="16"/><path d="M8 19 L15 26 L27 12"/></g><text x="68" y="441" fill="#506C7E" font-size="14.1" font-weight="400">Equal E1 row counts</text><text x="68" y="464" fill="#506C7E" font-size="14.1" font-weight="400">Labels and repetitions aligned</text><text x="68" y="502" fill="#237B65" font-size="12.7" font-weight="600">Row identity only</text><line x1="420" y1="452" x2="452" y2="452" stroke="#237B65" stroke-width="2.5" stroke-linecap="round" marker-end="url(#green-arrow)"/><rect x="465" y="387" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="465" y="387" width="6" height="126" rx="3" fill="#237B65"/><text x="483" y="413" fill="#173453" font-size="16.3" font-weight="700">Finite signal inspection</text><g transform="translate(774,402)" stroke="#237B65" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="28" height="30" rx="6"/><path d="M6 17 H11 L14 10 L18 27 L22 19 H27"/></g><text x="483" y="441" fill="#506C7E" font-size="14.1" font-weight="400">100% finite in observed arrays</text><text x="483" y="464" fill="#506C7E" font-size="14.1" font-weight="400">Native Acc rate: 148 Hz</text><text x="483" y="502" fill="#237B65" font-size="12.7" font-weight="600">Resampled source grid</text><line x1="835" y1="452" x2="867" y2="452" stroke="#237B65" stroke-width="2.5" stroke-linecap="round" marker-end="url(#green-arrow)"/><rect x="880" y="387" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="880" y="387" width="6" height="126" rx="3" fill="#237B65"/><text x="898" y="413" fill="#173453" font-size="16.3" font-weight="700">Corrected class labels</text><g transform="translate(1189,402)" stroke="#237B65" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="35" height="32" rx="4"/><path d="M7 12 H17 M7 20 H28 M7 28 H25"/></g><text x="898" y="441" fill="#506C7E" font-size="14.1" font-weight="400">Rest label 0 + 17 movements</text><text x="898" y="464" fill="#506C7E" font-size="14.1" font-weight="400">205 contiguous segments</text><text x="898" y="502" fill="#237B65" font-size="12.7" font-weight="600">restimulus</text><line x1="1250" y1="452" x2="1282" y2="452" stroke="#237B65" stroke-width="2.5" stroke-linecap="round" marker-end="url(#green-arrow)"/><rect x="1295" y="387" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="1295" y="387" width="6" height="126" rx="3" fill="#237B65"/><text x="1313" y="413" fill="#173453" font-size="16.3" font-weight="700">Repetition structure</text><g transform="translate(1604,402)" stroke="#237B65" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13 L19 3 L36 13 L19 23Z M2 20 L19 30 L36 20 M2 27 L19 37 L36 27"/></g><text x="1313" y="441" fill="#506C7E" font-size="14.1" font-weight="400">Codes 0–6 observed</text><text x="1313" y="464" fill="#506C7E" font-size="14.1" font-weight="400">Six movement repetitions</text><text x="1313" y="502" fill="#237B65" font-size="12.7" font-weight="600">rerepetition</text><rect x="24" y="542" width="1652" height="206" rx="16" fill="#EAF3FA" stroke="#245E9D" stroke-opacity="0.24" stroke-width="1.5"/><rect x="24" y="542" width="10" height="206" rx="5" fill="#245E9D"/><text x="52" y="568" fill="#245E9D" font-size="16.4" font-weight="700">SOURCE EVIDENCE AND RESEARCH HAND-OFF</text><text x="52" y="590" fill="#54738A" font-size="13.9" font-weight="400">Save inspectable outputs without fitting a classifier.</text><rect x="50" y="607" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="50" y="607" width="6" height="126" rx="3" fill="#245E9D"/><text x="68" y="633" fill="#173453" font-size="16.3" font-weight="700">Original channel traces</text><g transform="translate(359,622)" stroke="#245E9D" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4 V35 H36"/><rect x="10" y="22" width="5" height="13" rx="1"/><rect x="19" y="15" width="5" height="20" rx="1"/><rect x="28" y="8" width="5" height="27" rx="1"/></g><text x="68" y="661" fill="#506C7E" font-size="14.1" font-weight="400">Two-second paired interval</text><text x="68" y="684" fill="#506C7E" font-size="14.1" font-weight="400">01_alignment_examples.png</text><text x="68" y="722" fill="#245E9D" font-size="12.7" font-weight="600">Measured source segment</text><line x1="420" y1="672" x2="452" y2="672" stroke="#245E9D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#blue-arrow)"/><rect x="465" y="607" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="465" y="607" width="6" height="126" rx="3" fill="#245E9D"/><text x="483" y="633" fill="#173453" font-size="16.3" font-weight="700">Source pairing registry</text><g transform="translate(774,622)" stroke="#245E9D" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="32" height="34" rx="4"/><path d="M1 14 H33 M1 25 H33 M12 3 V37 M23 3 V37"/></g><text x="483" y="661" fill="#506C7E" font-size="14.1" font-weight="400">Record counts and channel sizes</text><text x="483" y="684" fill="#506C7E" font-size="14.1" font-weight="400">01_pairing_registry.csv</text><text x="483" y="722" fill="#245E9D" font-size="12.7" font-weight="600">Pilot source provenance</text><line x1="835" y1="672" x2="867" y2="672" stroke="#245E9D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#blue-arrow)"/><rect x="880" y="607" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="880" y="607" width="6" height="126" rx="3" fill="#245E9D"/><text x="898" y="633" fill="#173453" font-size="16.3" font-weight="700">Class and sensor dictionary</text><g transform="translate(1189,622)" stroke="#245E9D" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="35" height="32" rx="4"/><path d="M7 12 H17 M7 20 H28 M7 28 H25"/></g><text x="898" y="661" fill="#506C7E" font-size="14.1" font-weight="400">01_label_dictionary.csv</text><text x="898" y="684" fill="#506C7E" font-size="14.1" font-weight="400">01_sensor_dictionary.csv</text><text x="898" y="722" fill="#245E9D" font-size="12.7" font-weight="600">Fixed E1 class inventory</text><line x1="1250" y1="672" x2="1282" y2="672" stroke="#245E9D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#blue-arrow)"/><rect x="1295" y="607" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="1295" y="607" width="6" height="126" rx="3" fill="#245E9D"/><text x="1313" y="633" fill="#173453" font-size="16.3" font-weight="700">Next: population windowing</text><g transform="translate(1604,622)" stroke="#245E9D" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="34" height="28" rx="2"/><path d="M9 6 V34 M29 6 V34 M9 18 H29"/></g><text x="1313" y="661" fill="#506C7E" font-size="14.1" font-weight="400">Carry forward class definitions</text><text x="1313" y="684" fill="#506C7E" font-size="14.1" font-weight="400">Use verified E1 source fields</text><text x="1313" y="722" fill="#245E9D" font-size="12.7" font-weight="600">Inputs for paired windows</text><text x="38" y="793" fill="#54738A" font-size="13.5" font-weight="400">Scientific scope: original-source audit and descriptive trace evidence. No independent native-acceleration timestamp verification or classification experiment.</text></svg>