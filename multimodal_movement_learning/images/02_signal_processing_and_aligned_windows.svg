th="6" height="126" rx="3" fill="#237B65"/><text x="898" y="413" fill="#173453" font-size="16.3" font-weight="700">Acceleration branch</text><g transform="translate(1189,402)" stroke="#237B65" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="28" height="30" rx="6"/><path d="M6 17 H11 L14 10 L18 27 L22 19 H27"/></g><text x="898" y="441" fill="#506C7E" font-size="14.1" font-weight="400">36 original signal columns</text><text x="898" y="464" fill="#506C7E" font-size="14.1" font-weight="400">96 per-window features</text><text x="898" y="502" fill="#237B65" font-size="12.7" font-weight="600">Axis and magnitude summaries</text><line x1="1250" y1="452" x2="1282" y2="452" stroke="#237B65" stroke-width="2.5" stroke-linecap="round" marker-end="url(#green-arrow)"/><rect x="1295" y="387" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="1295" y="387" width="6" height="126" rx="3" fill="#237B65"/><text x="1313" y="413" fill="#173453" font-size="16.3" font-weight="700">Neural tensor contract</text><g transform="translate(1604,402)" stroke="#237B65" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13 L19 3 L36 13 L19 23Z M2 20 L19 30 L36 20 M2 27 L19 37 L36 27"/></g><text x="1313" y="441" fill="#506C7E" font-size="14.1" font-weight="400">sEMG: 600 × 12 samples</text><text x="1313" y="464" fill="#506C7E" font-size="14.1" font-weight="400">Acc: 600 × 36 samples</text><text x="1313" y="502" fill="#237B65" font-size="12.7" font-weight="600">Source-grid arrays</text><rect x="24" y="542" width="1652" height="206" rx="16" fill="#EAF3FA" stroke="#245E9D" stroke-opacity="0.24" stroke-width="1.5"/><rect x="24" y="542" width="10" height="206" rx="5" fill="#245E9D"/><text x="52" y="568" fill="#245E9D" font-size="16.4" font-weight="700">INDEPENDENCE, OUTPUTS AND MODEL HAND-OFF</text><text x="52" y="590" fill="#54738A" font-size="13.9" font-weight="400">Freeze participant roles before model fitting or validation.</text><rect x="50" y="607" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="50" y="607" width="6" height="126" rx="3" fill="#245E9D"/><text x="68" y="633" fill="#173453" font-size="16.3" font-weight="700">Person-disjoint roles</text><g transform="translate(359,622)" stroke="#245E9D" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="12" r="6"/><circle cx="29" cy="15" r="5"/><path d="M2 36 V29 Q2 21 14 21 Q26 21 26 29 V36 M26 26 Q36 26 36 34 V36"/></g><text x="68" y="661" fill="#506C7E" font-size="14.1" font-weight="400">35 Development participants</text><text x="68" y="684" fill="#506C7E" font-size="14.1" font-weight="400">5 reserved Test participants</text><text x="68" y="722" fill="#245E9D" font-size="12.7" font-weight="600">No shared subject IDs</text><line x1="420" y1="672" x2="452" y2="672" stroke="#245E9D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#blue-arrow)"/><rect x="465" y="607" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="465" y="607" width="6" height="126" rx="3" fill="#245E9D"/><text x="483" y="633" fill="#173453" font-size="16.3" font-weight="700">Development validation</text><g transform="translate(774,622)" stroke="#245E9D" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13 L19 3 L36 13 L19 23Z M2 20 L19 30 L36 20 M2 27 L19 37 L36 27"/></g><text x="483" y="661" fill="#506C7E" font-size="14.1" font-weight="400">Five participant-held-out folds</text><text x="483" y="684" fill="#506C7E" font-size="14.1" font-weight="400">7 people in each fold</text><text x="483" y="722" fill="#245E9D" font-size="12.7" font-weight="600">Model selection only</text><line x1="835" y1="672" x2="867" y2="672" stroke="#245E9D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#blue-arrow)"/><rect x="880" y="607" width="365" 