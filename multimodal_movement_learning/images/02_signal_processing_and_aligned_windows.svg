<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" font-family="DejaVu Sans, Arial, sans-serif">
<title>Source-safe temporal representation and participant roles</title>
<desc>One corrected E1 exercise per person to aligned sensor windows to independent participant groups. All transformations retain participant and trial ownership; no window crosses a corrected-label boundary.</desc>
<rect width="1700" height="480" fill="#F4F9FD"/>
<text x="40" y="46" fill="#173453" font-size="26" font-weight="bold"><tspan x="40" dy="0">Source-safe temporal representation and participant roles</tspan></text>
<rect x="40" y="73" width="1620" height="108" rx="15" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<text x="62" y="110" fill="#173453" font-size="18" font-weight="bold"><tspan x="62" dy="0">One corrected E1 exercise per person to aligned sensor windows to independent participant groups</tspan></text>
<text x="62" y="150" fill="#506C7E" font-size="15" font-weight="normal"><tspan x="62" dy="0">The same source-sample interval generates sEMG features, acceleration features and both neural input branches</tspan></text>
<rect x="40" y="202" width="1620" height="210" rx="15" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<rect x="56" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="72" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="72" dy="0">Verified source</tspan></text>
<text x="72" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="72" dy="0">Physical-time grid</tspan><tspan x="72" dy="24">Corrected segments</tspan></text>
<path d="M359 305 h15" stroke="#245E9D" stroke-width="3" stroke-linecap="round"/>
<path d="M368 298 l8 7 -8 7" stroke="#245E9D" stroke-width="3" fill="none" stroke-linejoin="round"/>
<rect x="382" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="398" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="398" dy="0">Window boundaries</tspan></text>
<text x="398" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="398" dy="0">300 ms duration</tspan><tspan x="398" dy="24">100 ms step</tspan></text>
<path d="M685 305 h15" stroke="#245E9D" stroke-width="3" stroke-linecap="round"/>
<path d="M694 298 l8 7 -8 7" stroke="#245E9D" stroke-width="3" fill="none" stroke-linejoin="round"/>
<rect x="708" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="724" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="724" dy="0">Paired features</tspan></text>
<text x="724" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="724" dy="0">48 sEMG statistics</tspan><tspan x="724" dy="24">96 Acc statistics</tspan></text>
<path d="M1011 305 h15" stroke="#245E9D" stroke-width="3" stroke-linecap="round"/>
<path d="M1020 298 l8 7 -8 7" stroke="#245E9D" stroke-width="3" fill="none" stroke-linejoin="round"/>
<rect x="1034" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="1050" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="1050" dy="0">Deep input arrays</tspan></text>
<text x="1050" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="1050" dy="0">Source-grid sequences</tspan><tspan x="1050" dy="24">Shared window keys</tspan></text>
<path d="M1337 305 h15" stroke="#245E9D" stroke-width="3" stroke-linecap="round"/>
<path d="M1346 298 l8 7 -8 7" stroke="#245E9D" stroke-width="3" fill="none" stroke-linejoin="round"/>
<rect x="1360" y="235" width="294" height="136" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="2"/>
<text x="1376" y="268" fill="#173453" font-size="18" font-weight="bold"><tspan x="1376" dy="0">Independent folds</tspan></text>
<text x="1376" y="308" fill="#506C7E" font-size="14" font-weight="normal"><tspan x="1376" dy="0">Reserved Test people</tspan><tspan x="1376" dy="24">Development CV roles</tspan></text>
<text x="40" y="448" fill="#54738A" font-size="15" font-weight="normal"><tspan x="40" dy="0">All transformations retain participant and trial ownership; no window crosses a corrected-label boundary.</tspan></text>
</svg>