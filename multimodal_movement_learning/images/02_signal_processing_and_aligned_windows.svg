<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="816" viewBox="0 0 1700 816" role="img" aria-labelledby="title desc" font-family="DejaVu Sans, Arial, sans-serif"><title id="title">NINAPRO DB2: PAIRED WINDOWS, FEATURE REPRESENTATIONS AND PERSON SPLITS</title><desc id="desc">Three-part workflow: ingest the exercise-one signals across the source cohort, define time-consistent paired windows and separate representations, and freeze participant-disjoint folds and output tables for downstream model development. Recorded counts reflect the saved notebook run.</desc><defs><marker id="blue-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#245E9D"/></marker><marker id="green-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#237B65"/></marker></defs><rect width="1700" height="816" rx="18" fill="#F4F9FD"/><text x="34" y="41" fill="#173453" font-size="24" font-weight="700">NINAPRO DB2: PAIRED WINDOWS, FEATURE REPRESENTATIONS AND PERSON SPLITS</text><text x="34" y="72" fill="#54738A" font-size="15" font-weight="400">Executed E1 cohort  ·  Consistent source-time windows  ·  Participant-independent Development and Test</text><line x1="30" y1="86" x2="1670" y2="86" stroke="#D9E8F1" stroke-width="2"/><rect x="24" y="102" width="1652" height="206" rx="16" fill="#EAF3FA" stroke="#245E9D" stroke-opacity="0.24" stroke-width="1.5"/><rect x="24" y="102" width="10" height="206" rx="5" fill="#245E9D"/><text x="52" y="128" fill="#245E9D" font-size="16.4" font-weight="700">PAIRED RECORDING COHORT</text><text x="52" y="150" fill="#54738A" font-size="13.9" font-weight="400">Retain subject identity, corrected labels and original sample intervals.</text><rect x="50" y="167" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="50" y="167" width="6" height="126" rx="3" fill="#245E9D"/><text x="68" y="193" fill="#173453" font-size="16.3" font-weight="700">Source participant cohort</text><g transform="translate(359,182)" stroke="#245E9D" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="12" r="6"/><circle cx="29" cy="15" r="5"/><path d="M2 36 V29 Q2 21 14 21 Q26 21 26 29 V36 M26 26 Q36 26 36 34 V36"/></g><text x="68" y="221" fill="#506C7E" font-size="14.1" font-weight="400">40 official DB2 archives</text><text x="68" y="244" fill="#506C7E" font-size="14.1" font-weight="400">E1 paired sEMG and Acc</text><text x="68" y="282" fill="#245E9D" font-size="12.7" font-weight="600">Per-person ingestion</text><line x1="420" y1="232" x2="452" y2="232" stroke="#245E9D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#blue-arrow)"/><rect x="465" y="167" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="465" y="167" width="6" height="126" rx="3" fill="#245E9D"/><text x="483" y="193" fill="#173453" font-size="16.3" font-weight="700">Corrected source labels</text><g transform="translate(774,182)" stroke="#245E9D" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="35" height="32" rx="4"/><path d="M7 12 H17 M7 20 H28 M7 28 H25"/></g><text x="483" y="221" fill="#506C7E" font-size="14.1" font-weight="400">Classes 0–17 including Rest</text><text x="483" y="244" fill="#506C7E" font-size="14.1" font-weight="400">Segment / repetition identities</text><text x="483" y="282" fill="#245E9D" font-size="12.7" font-weight="600">No transitions crossed</text><line x1="835" y1="232" x2="867" y2="232" stroke="#245E9D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#blue-arrow)"/><rect x="880" y="167" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="880" y="167" width="6" height="126" rx="3" fill="#245E9D"/><text x="898" y="193" fill="#173453" font-size="16.3" font-weight="700">Window specification</text><g transform="translate(1189,182)" stroke="#245E9D" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="34" height="28" rx="2"/><path d="M9 6 V34 M29 6 V34 M9 18 H29"/></g><text x="898" y="221" fill="#506C7E" font-size="14.1" font-weight="400">300-ms source windows</text><text x="898" y="244" fill="#506C7E" font-size="14.1" font-weight="400">100-ms temporal step</text><text x="898" y="282" fill="#245E9D" font-size="12.7" font-weight="600">600 rows per window</text><line x1="1250" y1="232" x2="1282" y2="232" stroke="#245E9D" stroke-width="2.5" stroke-linecap="round" marker-end="url(#blue-arrow)"/><rect x="1295" y="167" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.5"/><rect x="1295" y="167" width="6" height="126" rx="3" fill="#245E9D"/><text x="1313" y="193" fill="#173453" font-size="16.3" font-weight="700">All eligible windows</text><g transform="translate(1604,182)" stroke="#245E9D" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="32" height="34" rx="4"/><path d="M1 14 H33 M1 25 H33 M12 3 V37 M23 3 V37"/></g><text x="1313" y="221" fill="#506C7E" font-size="14.1" font-weight="400">337,853 eligible E1 windows</text><text x="1313" y="244" fill="#506C7E" font-size="14.1" font-weight="400">Record full source coverage</text><text x="1313" y="282" fill="#245E9D" font-size="12.7" font-weight="600">Before budget selection</text><rect x="24" y="322" width="1652" height="206" rx="16" fill="#EDF8F1" stroke="#237B65" stroke-opacity="0.24" stroke-width="1.5"/><rect x="24" y="322" width="10" height="206" rx="5" fill="#237B65"/><text x="52" y="348" fill="#237B65" font-size="16.4" font-weight="700">ALIGNED INPUT REPRESENTATIONS</text><text x="52" y="370" fill="#54738A" font-size="13.9" font-weight="400">Use precisely matching sample intervals for both modalities.</text><rect x="50" y="387" width="365" height="126" rx="12" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.