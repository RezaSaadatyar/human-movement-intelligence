<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">Human Movement Intelligence research portfolio overview</title>
<desc id="desc">Overview of the research repository, distinguishing the completed HARTH wearable activity recognition study, exploratory BoneNet biomechanical load regression and future research directions. The lower flow describes shared research engineering practices rather than asserting that all studies completed every stage.</desc>
<defs><marker id="small-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs>
<rect width="1700" height="480" rx="20" fill="#F4F9FD"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="30" y="38" font-size="23" fill="#173453" font-weight="700">HUMAN MOVEMENT INTELLIGENCE | RESEARCH PORTFOLIO</text>
<text x="30" y="67" font-size="15" fill="#54738A">Python research infrastructure · study-specific evidence · explicit status boundaries</text>
<rect x="24" y="84" width="1652" height="160" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<rect x="24" y="262" width="1652" height="174" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<g aria-label="Four study context panels"><g aria-label="RESEARCH FRAMEWORK"><text x="50" y="115" font-size="15" fill="#173453" font-weight="700">RESEARCH FRAMEWORK</text><text x="50" y="145" font-size="13" fill="#506C7E">Wearable and movement data</text><text x="50" y="167" font-size="13" fill="#506C7E">Participant-aware evaluation</text><text x="50" y="189" font-size="13" fill="#506C7E">Reusable Python utilities</text><text x="50" y="229" font-size="11.5" fill="#54738A">Methods vary by individual study</text></g>
<g aria-label="HARTH | COMPLETED STUDY"><text x="380" y="115" font-size="15" fill="#173453" font-weight="700">HARTH | COMPLETED STUDY</text><text x="380" y="145" font-size="13" fill="#506C7E">27 executed notebook stages</text><text x="380" y="167" font-size="13" fill="#506C7E">29-person Development cohort</text><text x="380" y="189" font-size="13" fill="#506C7E">Qualified two-person held-out check</text><text x="380" y="229" font-size="11.5" fill="#54738A">Not blind external validation</text></g>
<g aria-label="BONENET | EXPLORATORY"><text x="742" y="115" font-size="15" fill="#173453" font-weight="700">BONENET | EXPLORATORY</text><text x="742" y="145" font-size="13" fill="#506C7E">444-record derivative inspected</text><text x="742" y="167" font-size="13" fill="#506C7E">Model-derived strain targets</text><text x="742" y="189" font-size="13" fill="#506C7E">Preliminary Ridge and mean baselines</text><text x="742" y="229" font-size="11.5" fill="#54738A">Record-to-subject mapping unresolved</text></g>
<g aria-label="FUTURE RESEARCH DIRECTIONS"><text x="1110" y="115" font-size="15" fill="#173453" font-weight="700">FUTURE RESEARCH DIRECTIONS</text><text x="1110" y="145" font-size="13" fill="#506C7E">Gait · markerless movement</text><text x="1110" y="167" font-size="13" fill="#506C7E">Neurorehabilitation · EEG / EMG</text><text x="1110" y="189" font-size="13" fill="#506C7E">Multimodal movement analysis</text><text x="1110" y="229" font-size="11.5" fill="#54738A">Planned, not completed studies</text></g></g>
<g aria-label="Six horizontal scientific workflow arrows"><path d="M252 353 H266" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M488 353 H502" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M724 353 H738" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M960 353 H974" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M1196 353 H1210" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M1432 353 H1446" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/></g>
