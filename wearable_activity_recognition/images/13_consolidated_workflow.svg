<path d="M1420 290 V375" stroke="#3F7493" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
<path d="M970 455 H1026" stroke="#D39E4A" stroke-width="3" marker-end="url(#arrow)" stroke-dasharray="9 6" fill="none"/>
<text x="72" y="169" font-size="21" font-weight="700" fill="#17384D">Development evidence</text><text x="72" y="203" font-size="16" fill="#35536A">Notebook 10: seven-model benchmark</text><text x="72" y="230" font-size="16" fill="#35536A">Notebook 11: seed and loss robustness</text><text x="72" y="257" font-size="16" fill="#35536A">Notebook 12: selected configurations</text>
<text x="472" y="169" font-size="21" font-weight="700" fill="#17384D">HARTH v2.0 source</text><text x="472" y="203" font-size="16" fill="#35536A">29 Development participants</text><text x="472" y="230" font-size="16" fill="#35536A">Six acceleration channels</text><text x="472" y="257" font-size="16" fill="#35536A">14,201 windows; eight activity codes</text>
<text x="872" y="169" font-size="21" font-weight="700" fill="#17384D">Final Development fitting</text><text x="872" y="203" font-size="16" fill="#35536A">Weighted 1D-ResNet; 400 updates</text><text x="872" y="230" font-size="16" fill="#35536A">Random Forest; 120 trees</text><text x="872" y="257" font-size="16" fill="#35536A">Train-only scaling and weights</text>
<text x="1272" y="169" font-size="21" font-weight="700" fill="#17384D">Reusable artefacts</text><text x="1272" y="203" font-size="16" fill="#35536A">ResNet weights; fitted Random Forest</text><text x="1272" y="230" font-size="16" fill="#35536A">Inference configuration; reload test</text><text x="1272" y="257" font-size="16" fill="#35536A">Training tables and loss figure</text>
<text x="472" y="414" font-size="21" font-weight="700" fill="#17384D">Separate historical evidence</text><text x="472" y="448" font-size="16" fill="#35536A">Original aligned predictions from earlier evaluation</text><text x="472" y="475" font-size="16" fill="#35536A">S023 and S032; previously inspected</text><text x="472" y="502" font-size="16" fill="#35536A">Only summarised if the real CSV is available</text>
<text x="1052" y="414" font-size="21" font-weight="700" fill="#17384D">Final scientific synthesis</text><text x="1052" y="448" font-size="16" fill="#35536A">Development selection and training evidence</text><text x="1052" y="475" font-size="16" fill="#35536A">Historical qualified results, if supplied</text><text x="1052" y="502" font-size="16" fill="#35536A">Rare-class, calibration and generalisation limits</text>
<text x="52" y="580" font-size="16" fill="#496B80">Solid arrows: current Development fitting and owned outputs</text>
<text x="705" y="580" font-size="16" fill="#9E742B">Dashed arrow: original historical Test evidence only, when available</text>
