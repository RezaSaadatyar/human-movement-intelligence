<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="620" viewBox="0 0 1640 620" role="img" aria-labelledby="title desc">
<title id="title">HARTH final Development training and research evidence synthesis</title>
<desc id="desc">A reproducible workflow that preserves subject-disjoint Development model selection and final fitting, then separately summarises any original saved qualified held-out predictions. The diagram does not represent a new Test evaluation or invented model results.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#3F7493"/></marker></defs>
<rect width="1640" height="620" rx="20" fill="#F8FAFC"/>
<text x="50" y="56" font-size="30" font-weight="700" fill="#17384D">HARTH FINAL DEVELOPMENT TRAINING AND RESEARCH EVIDENCE</text>
<text x="50" y="91" font-size="18" fill="#496B80">Human Movement Intelligence | Notebook 13 | Two distinct evidence pathways</text>
<rect x="50" y="135" width="340" height="155" rx="16" fill="#E4EFF9" stroke="#B4C7D7" stroke-width="2"/>
