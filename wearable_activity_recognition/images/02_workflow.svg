   <path d="M84 189 L80 213 L79 226 M106 189 L111 214 L112 226" fill="none"/>
   <path d="M79 226 L88 227 M112 226 L120 227" fill="none"/>
  </g>
  <rect x="86" y="171" width="18" height="11" rx="2.5" fill="#245E9D" stroke="#FFFFFF" stroke-width="1.3"/>
  <rect x="77" y="199" width="16" height="11" rx="2.5" fill="#22A0A0" stroke="#FFFFFF" stroke-width="1.3"/>
  <path d="M104 176 H140" stroke="#245E9D" stroke-width="1.5"/><text x="146" y="180" font-size="12.8" fill="#173453">Lower back</text>
  <path d="M93 204 H140" stroke="#15938F" stroke-width="1.5"/><text x="146" y="208" font-size="12.8" fill="#173453">Thigh</text>
 </g>
 <g>
  <text x="340" y="115" font-size="15" font-weight="700" fill="#173453">Sensor Inputs</text>
  <text x="340" y="145" font-size="13.5" fill="#506C7E">HARTH v2.0 / S023.csv</text>
  <text x="340" y="167" font-size="13.5" fill="#506C7E">Back x/y/z + thigh x/y/z</text>
  <text x="340" y="189" font-size="13.5" fill="#506C7E">Six acceleration channels (g)</text>
 </g>
 <g>
  <text x="605" y="115" font-size="15" font-weight="700" fill="#173453">Sliding Windows</text>
  <text x="605" y="145" font-size="13.5" fill="#506C7E">50 Hz · 100 samples (2 s)</text>
  <text x="605" y="167" font-size="13.5" fill="#506C7E">Step: 50 samples</text>
  <text x="605" y="189" font-size="13.5" fill="#506C7E">Overlap: 50%</text>
 </g>
 <g>
  <text x="900" y="115" font-size="15" font-weight="700" fill="#173453">Eligibility Controls</text>
  <text x="900" y="145" font-size="13.5" fill="#506C7E">All 100 labels must agree</text>
  <text x="900" y="167" font-size="13.5" fill="#506C7E">No gaps &gt; 1.5× sample period</text>
  <text x="900" y="189" font-size="13.5" fill="#506C7E">Keep original sample indices</text>
 </g>
 <g aria-label="Illustrative accelerometer waveform and two overlapping windows">
  <text x="1255" y="115" font-size="14" font-weight="700" fill="#173453">OVERLAPPING WINDOW SCHEMATIC</text>
