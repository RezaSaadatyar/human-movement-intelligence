   <text x="1086" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">Original vs retained</text>
   <text x="1086" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Per-activity counts</text>
   <text x="1086" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Distribution chart</text>
  </g>
<g class="process-block">
   <rect x="1218" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
   <text x="1322" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">05</text>
   <text x="1322" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Signal Preview</text>
   <text x="1322" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">First eligible window</text>
   <text x="1322" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Back x/y/z in g</text>
   <text x="1322" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Unscaled source trace</text>
  </g>
<g class="process-block">
   <rect x="1454" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/>
   <text x="1558" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A7E9DF">OUTPUT</text>
   <text x="1558" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Quality Gate</text>
   <text x="1558" y="358" text-anchor="middle" font-size="12.6" fill="#DFEDF4">100% label purity</text>
   <text x="1558" y="378" text-anchor="middle" font-size="12.6" fill="#DFEDF4">Source indices checked</text>
   <text x="1558" y="398" text-anchor="middle" font-size="12.6" fill="#DFEDF4">No model training</text>
  </g></g>
 <text x="30" y="466" font-size="13.5" fill="#54738A">Source signals → trusted HARTH loading → 2-second window specification → label/time-safe segmentation → class support → original signal plot → quality gate</text>
</g>
</svg>
