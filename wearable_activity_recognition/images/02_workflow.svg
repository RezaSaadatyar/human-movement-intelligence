 <g aria-label="Seven sequential, source-grounded workflow blocks"><g class="process-block">
   <rect x="38" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/>
   <text x="142" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A7E9DF">INPUT</text>
   <text x="142" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">HARTH v2.0</text>
   <text x="142" y="358" text-anchor="middle" font-size="12.6" fill="#DFEDF4">S023.csv · 50 Hz</text>
   <text x="142" y="378" text-anchor="middle" font-size="12.6" fill="#DFEDF4">Back + thigh sensors</text>
   <text x="142" y="398" text-anchor="middle" font-size="12.6" fill="#DFEDF4">6-axis source signals</text>
  </g>
<g class="process-block">
   <rect x="274" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
   <text x="378" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">01</text>
   <text x="378" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Load Recording</text>
   <text x="378" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">Official CSV or cache</text>
   <text x="378" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Time, labels and axes</text>
   <text x="378" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Continuous samples</text>
  </g>
<g class="process-block">
   <rect x="510" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
   <text x="614" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">02</text>
   <text x="614" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Window Protocol</text>
   <text x="614" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">2 s · 100 samples</text>
   <text x="614" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Stride 50 samples</text>
   <text x="614" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">50% overlap</text>
  </g>
<g class="process-block">
   <rect x="746" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
   <text x="850" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">03</text>
   <text x="850" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Build Windows</text>
   <text x="850" y="358" text-anchor="middle" font-size="12.6" fill="#506C7E">Reject label changes</text>
   <text x="850" y="378" text-anchor="middle" font-size="12.6" fill="#506C7E">Reject time gaps</text>
   <text x="850" y="398" text-anchor="middle" font-size="12.6" fill="#506C7E">Tensor: N × 6 × 100</text>
  </g>
<g class="process-block">
   <rect x="982" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/>
