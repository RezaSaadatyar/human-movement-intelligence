<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">HARTH v2.0 wearable activity recognition: complete research workflow and evidence</title>
<desc id="desc">Study-wide HARTH v2.0 research workflow: six-channel wearable accelerometer data, label-pure and time-safe windows, statistical and temporal features, participant-disjoint Development benchmarking, repeated-seed robustness and frozen selection, qualified same-study held-out evaluation, and the completed evidence report and FINAL provenance audit. The two held-out participants were previously inspected descriptively; this is not blind external validation.</desc>
<defs><marker id="small-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs>
<rect width="1700" height="480" rx="20" fill="#F4F9FD"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="30" y="38" font-size="25" fill="#173453" font-weight="700">HARTH v2.0 | WEARABLE ACTIVITY RECOGNITION RESEARCH</text>
<text x="30" y="67" font-size="17" fill="#54738A">Eight activities · participant-disjoint Development · seven-model benchmark · qualified evaluation · FINAL audit</text>
<rect x="24" y="84" width="1652" height="160" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<rect x="24" y="262" width="1652" height="174" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<g aria-label="Four study context panels"><g aria-label="HARTH SOURCE DATA"><text x="50" y="115" font-size="17" fill="#173453" font-weight="700">HARTH SOURCE DATA</text><text x="50" y="145" font-size="15" fill="#506C7E">Lower-back and thigh IMUs</text><text x="50" y="167" font-size="15" fill="#506C7E">Six axes · nominal 50 Hz</text><text x="50" y="189" font-size="15" fill="#506C7E">Eight documented task activities</text><text x="50" y="229" font-size="14" fill="#54738A">Authors' official pinned v2.0 revision</text></g>
<g aria-label="DEVELOPMENT PROTOCOL"><text x="380" y="115" font-size="17" fill="#173453" font-weight="700">DEVELOPMENT PROTOCOL</text><text x="380" y="145" font-size="15" fill="#506C7E">29 people · 14,201 benchmark windows</text><text x="380" y="167" font-size="15" fill="#506C7E">2 s windows · 50-sample stride</text><text x="380" y="189" font-size="15" fill="#506C7E">Participant-disjoint model folds</text><text x="380" y="229" font-size="14" fill="#54738A">Seven models · three seeds · 36 fits</text></g>
<g aria-label="QUALIFIED HELD-OUT EVALUATION"><text x="742" y="115" font-size="17" fill="#173453" font-weight="700">QUALIFIED HELD-OUT EVALUATION</text><text x="742" y="145" font-size="15" fill="#506C7E">S023 and S032 · 500 windows each</text><text x="742" y="167" font-size="15" fill="#506C7E">Previously inspected descriptively</text><text x="742" y="189" font-size="15" fill="#506C7E">No Test-driven model adjustment</text><text x="742" y="229" font-size="14" fill="#54738A">Qualified same-study, not blind / external</text></g>
<g aria-label="SCIENTIFIC RESULTS &amp; AUDIT"><text x="1110" y="115" font-size="17" fill="#173453" font-weight="700">SCIENTIFIC RESULTS &amp; AUDIT</text><text x="1110" y="145" font-size="15" fill="#506C7E">ResNet held-out Macro F1: 0.7182</text><text x="1110" y="167" font-size="15" fill="#506C7E">RF held-out Macro F1: 0.6817</text><text x="1110" y="189" font-size="15" fill="#506C7E">Rare-class support is very limited</text><text x="1110" y="229" font-size="14" fill="#54738A">FINAL evidence audit: PASSED</text></g></g>
<g aria-label="Six horizontal scientific workflow arrows"><path d="M252 353 H266" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M488 353 H502" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M724 353 H738" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M960 353 H974" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M1196 353 H1210" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M1432 353 H1446" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/></g>
<g aria-label="Seven research process blocks"><g class="process-block" aria-label="HARTH v2.0"><rect x="38" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="142" y="310" font-size="14.5" fill="#A7E9DF" font-weight="700" text-anchor="middle">INPUT</text><text x="142" y="336" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">HARTH v2.0</text><text x="142" y="358" font-size="13.8" fill="#DFEDF4" text-anchor="middle">Six IMU channels</text><text x="142" y="378" font-size="13.8" fill="#DFEDF4" text-anchor="middle">Participant recordings</text><text x="142" y="398" font-size="13.8" fill="#DFEDF4" text-anchor="middle">Documented activities</text></g>
<g class="process-block" aria-label="Validate Windows"><rect x="274" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="378" y="310" font-size="14.5" fill="#497992" font-weight="700" text-anchor="middle">WINDOWS</text><text x="378" y="336" font-size="16" fill="#173453" font-weight="700" text-anchor="middle">Validate Windows</text><text x="378" y="358" font-size="13.8" fill="#506C7E" text-anchor="middle">Timestamp continuity</text><text x="378" y="378" font-size="13.8" fill="#506C7E" text-anchor="middle">Single-activity labels</text><text x="378" y="398" font-size="13.8" fill="#506C7E" text-anchor="middle">100 points; stride 50</text></g>
<g class="process-block" aria-label="Build Features"><rect x="510" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="614" y="310" font-size="14.5" fill="#497992" font-weight="700" text-anchor="middle">FEATURES</text><text x="614" y="336" font-size="16" fill="#173453" font-weight="700" text-anchor="middle">Build Features</text><text x="614" y="358" font-size="13.8" fill="#506C7E" text-anchor="middle">Time-series windows</text><text x="614" y="378" font-size="13.8" fill="#506C7E" text-anchor="middle">30 RF statistics</text><text x="614" y="398" font-size="13.8" fill="#506C7E" text-anchor="middle">Train-only scaling</text></g>
<g class="process-block" aria-label="Benchmark Models"><rect x="746" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="850" y="310" font-size="14.5" fill="#497992" font-weight="700" text-anchor="middle">MODELS</text><text x="850" y="336" font-size="16" fill="#173453" font-weight="700" text-anchor="middle">Benchmark Models</text><text x="850" y="358" font-size="13.8" fill="#506C7E" text-anchor="middle">7 matched configurations</text><text x="850" y="378" font-size="13.8" fill="#506C7E" text-anchor="middle">Participant-held-out CV</text><text x="850" y="398" font-size="13.8" fill="#506C7E" text-anchor="middle">Class-level analysis</text></g>
<g class="process-block" aria-label="Select and Freeze"><rect x="982" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="1086" y="310" font-size="14.5" fill="#497992" font-weight="700" text-anchor="middle">FREEZE</text><text x="1086" y="336" font-size="16" fill="#173453" font-weight="700" text-anchor="middle">Select and Freeze</text><text x="1086" y="358" font-size="13.8" fill="#506C7E" text-anchor="middle">Seed / loss robustness</text><text x="1086" y="378" font-size="13.8" fill="#506C7E" text-anchor="middle">Choose ResNet and RF</text><text x="1086" y="398" font-size="13.8" fill="#506C7E" text-anchor="middle">Approval and provenance</text></g>
<g class="process-block" aria-label="Qualified Assessment"><rect x="1218" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="1322" y="310" font-size="14.5" fill="#497992" font-weight="700" text-anchor="middle">ASSESS</text><text x="1322" y="336" font-size="16" fill="#173453" font-weight="700" text-anchor="middle">Qualified Assessment</text><text x="1322" y="358" font-size="13.8" fill="#506C7E" text-anchor="middle">Two same-study people</text><text x="1322" y="378" font-size="13.8" fill="#506C7E" text-anchor="middle">1,000 selected windows</text><text x="1322" y="398" font-size="13.8" fill="#506C7E" text-anchor="middle">Pre-approved settings</text></g>
<g class="process-block" aria-label="Evidence and Final Audit"><rect x="1454" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="1558" y="310" font-size="14.5" fill="#A7E9DF" font-weight="700" text-anchor="middle">OUTPUT</text><text x="1558" y="336" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">Report &amp; Audit</text><text x="1558" y="358" font-size="13.8" fill="#DFEDF4" text-anchor="middle">Evidence synthesis</text><text x="1558" y="378" font-size="13.8" fill="#DFEDF4" text-anchor="middle">FINAL audit passed</text><text x="1558" y="398" font-size="13.8" fill="#DFEDF4" text-anchor="middle">No external validation</text></g></g>
<text x="30" y="465" font-size="14.5" fill="#54738A">Source audit → windowing and features → Development benchmark → frozen models → qualified assessment → report and FINAL research audit</text>
</g>
</svg>