<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">HARTH wearable activity recognition overall study workflow</title>
<desc id="desc">Overall research workflow across HARTH notebook stages 01–26, from six-channel back and thigh accelerometers through time-safe source windowing, participant-group Development model comparisons, repeated-seed robustness, model selection, separately approved qualified same-study held-out scoring, and read-only evidence synthesis. Previous descriptive exposure to the two held-out participants means this is not historically blind external validation.</desc>
<defs><marker id="small-arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs>
<rect width="1700" height="480" rx="20" fill="#F4F9FD"/>
<g font-family="DejaVu Sans, Arial, sans-serif">
<text x="30" y="38" font-size="25" fill="#173453" font-weight="700">HARTH v2.0 | COMPLETE WEARABLE ACTIVITY RECOGNITION STUDY</text>
<text x="30" y="67" font-size="17" fill="#54738A">26 notebook stages · seven-model Development benchmark · qualified same-study held-out evaluation</text>
<rect x="24" y="84" width="1652" height="160" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<rect x="24" y="262" width="1652" height="174" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<g aria-label="Four study context panels"><g aria-label="HARTH SOURCE DATA"><text x="50" y="115" font-size="17" fill="#173453" font-weight="700">HARTH SOURCE DATA</text><text x="50" y="145" font-size="15" fill="#506C7E">Lower-back and thigh IMUs</text><text x="50" y="167" font-size="15" fill="#506C7E">Six axes · nominal 50 Hz</text><text x="50" y="189" font-size="15" fill="#506C7E">Eight documented task activities</text><text x="50" y="229" font-size="14" fill="#54738A">Authors' official pinned v2.0 revision</text></g>
<g aria-label="DEVELOPMENT PROTOCOL"><text x="380" y="115" font-size="17" fill="#173453" font-weight="700">DEVELOPMENT PROTOCOL</text><text x="380" y="145" font-size="15" fill="#506C7E">29 participants · 14,201 windows</text><text x="380" y="167" font-size="15" fill="#506C7E">2 s windows · 50-sample stride</text><text x="380" y="189" font-size="15" fill="#506C7E">Participant-disjoint model folds</text><text x="380" y="229" font-size="14" fill="#54738A">Seven models · 36 robustness fits</text></g>
<g aria-label="APPROVED HELD-OUT CHECK"><text x="742" y="115" font-size="17" fill="#173453" font-weight="700">APPROVED HELD-OUT CHECK</text><text x="742" y="145" font-size="15" fill="#506C7E">S023 and S032 · 500 windows each</text><text x="742" y="167" font-size="15" fill="#506C7E">Previously inspected descriptively</text><text x="742" y="189" font-size="15" fill="#506C7E">No Test-driven model adjustment</text><text x="742" y="229" font-size="14" fill="#54738A">Qualified same-study, not blind / external</text></g>
<g aria-label="OBSERVED SCIENTIFIC RESULTS"><text x="1110" y="115" font-size="17" fill="#173453" font-weight="700">OBSERVED SCIENTIFIC RESULTS</text><text x="1110" y="145" font-size="15" fill="#506C7E">1D-ResNet Macro F1: 0.7182</text><text x="1110" y="167" font-size="15" fill="#506C7E">Random Forest Macro F1: 0.6817</text><text x="1110" y="189" font-size="15" fill="#506C7E">Rare-class support is very limited</text><text x="1110" y="229" font-size="14" fill="#54738A">Fixed eight-class held-out metric</text></g></g>
<g aria-label="Six horizontal scientific workflow arrows"><path d="M252 353 H266" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M488 353 H502" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M724 353 H738" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M960 353 H974" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M1196 353 H1210" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/><path d="M1432 353 H1446" fill="none" stroke="#245E9D" stroke-width="2.2" stroke-linecap="round" marker-end="url(#small-arrow)"/></g>
<g aria-label="Seven research process blocks"><g class="process-block" aria-label="HARTH v2.0"><rect x="38" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="142" y="310" font-size="14.5" fill="#A7E9DF" font-weight="700" text-anchor="middle">INPUT</text><text x="142" y="336" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">HARTH v2.0</text><text x="142" y="358" font-size="13.8" fill="#DFEDF4" text-anchor="middle">Six IMU channels</text><text x="142" y="378" font-size="13.8" fill="#DFEDF4" text-anchor="middle">Participant recordings</text><text x="142" y="398" font-size="13.8" fill="#DFEDF4" text-anchor="middle">Documented activities</text></g>
<g class="process-block" aria-label="Validate Windows"><rect x="274" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="378" y="310" font-size="14.5" fill="#497992" font-weight="700" text-anchor="middle">01</text><text x="378" y="336" font-size="16" fill="#173453" font-weight="700" text-anchor="middle">Validate Windows</text><text x="378" y="358" font-size="13.8" fill="#506C7E" text-anchor="middle">Timestamp continuity</text><text x="378" y="378" font-size="13.8" fill="#506C7E" text-anchor="middle">Single-activity labels</text><text x="378" y="398" font-size="13.8" fill="#506C7E" text-anchor="middle">100 points; stride 50</text></g>
<g class="process-block" aria-label="Build Features"><rect x="510" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="614" y="310" font-size="14.5" fill="#497992" font-weight="700" text-anchor="middle">02</text><text x="614" y="336" font-size="16" fill="#173453" font-weight="700" text-anchor="middle">Build Features</text><text x="614" y="358" font-size="13.8" fill="#506C7E" text-anchor="middle">Time-series windows</text><text x="614" y="378" font-size="13.8" fill="#506C7E" text-anchor="middle">30 RF statistics</text><text x="614" y="398" font-size="13.8" fill="#506C7E" text-anchor="middle">Train-only scaling</text></g>
<g class="process-block" aria-label="Benchmark Models"><rect x="746" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="850" y="310" font-size="14.5" fill="#497992" font-weight="700" text-anchor="middle">03</text><text x="850" y="336" font-size="16" fill="#173453" font-weight="700" text-anchor="middle">Benchmark Models</text><text x="850" y="358" font-size="13.8" fill="#506C7E" text-anchor="middle">7 matched configurations</text><text x="850" y="378" font-size="13.8" fill="#506C7E" text-anchor="middle">Participant-held-out CV</text><text x="850" y="398" font-size="13.8" fill="#506C7E" text-anchor="middle">Class-level analysis</text></g>
<g class="process-block" aria-label="Select and Freeze"><rect x="982" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="1086" y="310" font-size="14.5" fill="#497992" font-weight="700" text-anchor="middle">04</text><text x="1086" y="336" font-size="16" fill="#173453" font-weight="700" text-anchor="middle">Select and Freeze</text><text x="1086" y="358" font-size="13.8" fill="#506C7E" text-anchor="middle">Seed / loss robustness</text><text x="1086" y="378" font-size="13.8" fill="#506C7E" text-anchor="middle">Choose ResNet and RF</text><text x="1086" y="398" font-size="13.8" fill="#506C7E" text-anchor="middle">Approval and provenance</text></g>
<g class="process-block" aria-label="Qualified Test"><rect x="1218" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="1322" y="310" font-size="14.5" fill="#497992" font-weight="700" text-anchor="middle">05</text><text x="1322" y="336" font-size="16" fill="#173453" font-weight="700" text-anchor="middle">Qualified Test</text><text x="1322" y="358" font-size="13.8" fill="#506C7E" text-anchor="middle">Two same-study people</text><text x="1322" y="378" font-size="13.8" fill="#506C7E" text-anchor="middle">1,000 selected windows</text><text x="1322" y="398" font-size="13.8" fill="#506C7E" text-anchor="middle">Pre-approved settings</text></g>
<g class="process-block" aria-label="Evidence Report"><rect x="1454" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="1558" y="310" font-size="14.5" fill="#A7E9DF" font-weight="700" text-anchor="middle">OUTPUT</text><text x="1558" y="336" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle">Evidence Report</text><text x="1558" y="358" font-size="13.8" fill="#DFEDF4" text-anchor="middle">Evidence synthesis</text><text x="1558" y="378" font-size="13.8" fill="#DFEDF4" text-anchor="middle">Per-class limitations</text><text x="1558" y="398" font-size="13.8" fill="#DFEDF4" text-anchor="middle">No external validation</text></g></g>
<text x="30" y="465" font-size="14.5" fill="#54738A">Source audit → windowing and features → grouped Development comparison → frozen models → qualified held-out scoring → read-only research report</text>
</g>
</svg>