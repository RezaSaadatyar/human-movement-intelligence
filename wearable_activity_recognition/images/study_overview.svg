<text x="30" y="38" font-size="23" fill="#173453" font-weight="700">HARTH v2.0 | WEARABLE ACTIVITY RECOGNITION</text>
<text x="30" y="67" font-size="15" fill="#54738A" >Six-channel wearable signals · participant-grouped Development · model selection · qualified same-source assessment</text>
<rect x="24" y="84" width="1652" height="160" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="2"/>
<text x="49" y="114" font-size="16" fill="#173453" font-weight="700">SOURCE AND TASK</text>
<text x="49" y="145" font-size="14" fill="#506C7E" >Official NTNU HARTH v2.0</text>
<text x="49" y="167" font-size="14" fill="#506C7E" >Lower-back and thigh accelerometers</text>
<text x="49" y="189" font-size="14" fill="#506C7E" >Six channels · 50 Hz · eight activities</text>
<text x="49" y="229" font-size="13" fill="#54738A" >Original participant recordings</text>
<text x="451" y="114" font-size="16" fill="#173453" font-weight="700">DEVELOPMENT PROTOCOL</text>
<text x="451" y="145" font-size="14" fill="#506C7E" >29 participants · 14,201 windows</text>
<text x="451" y="167" font-size="14" fill="#506C7E" >Participant-disjoint grouped CV</text>
<text x="451" y="189" font-size="14" fill="#506C7E" >Separate three-seed loss robustness</text>
<text x="451" y="229" font-size="13" fill="#54738A" >All selection within Development</text>
<line x1="434" y1="104" x2="434" y2="225" stroke="#C5D7E4" stroke-width="1.4" stroke-linecap="round"/>
<text x="853" y="114" font-size="16" fill="#173453" font-weight="700">SELECTED MODELS</text>
<text x="853" y="145" font-size="14" fill="#506C7E" >Seven-model benchmark</text>
<text x="853" y="167" font-size="14" fill="#506C7E" >Weighted 1D-ResNet primary</text>
<text x="853" y="189" font-size="14" fill="#506C7E" >Random Forest classical reference</text>
<text x="853" y="229" font-size="13" fill="#54738A" >Final fit on Development only</text>
<line x1="836" y1="104" x2="836" y2="225" stroke="#C5D7E4" stroke-width="1.4" stroke-linecap="round"/>
<text x="1255" y="114" font-size="16" fill="#173453" font-weight="700">QUALIFIED ASSESSMENT</text>
<text x="1255" y="145" font-size="14" fill="#506C7E" >S023 and S032 · 500 windows each</text>
<text x="1255" y="167" font-size="14" fill="#506C7E" >Previously inspected descriptively</text>
<text x="1255" y="189" font-size="14" fill="#506C7E" >Same-source fitted-model predictions</text>
<text x="1255" y="229" font-size="13" fill="#54738A" >Not blind or external validation</text>
