<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="816" viewBox="0 0 1700 816" role="img" aria-labelledby="title desc">
<title id="title">HARTH v2.0 wearable activity recognition: study-wide workflow and research evidence</title>
<desc id="desc">Three-layer scientific illustration of the HARTH study. The top layer summarises official six-channel source data, participant-disjoint Development, selected models and the qualified S023/S032 assessment. The middle layer schematically illustrates worn sensors, label-safe signal windows, saved Development model-comparison results, and two-person same-source assessment. The bottom layer maps the research pipeline from source windows through model selection to current outputs. Synthetic traces are illustrative. S023/S032 were previously inspected; this is not independent external or blind validation.</desc>
<defs><marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="6" markerHeight="6" refX="5.5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#245E9D"/></marker></defs>
