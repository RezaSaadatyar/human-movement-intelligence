<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="816" viewBox="0 0 1700 816" role="img" aria-labelledby="title desc">
<title id="title">HARTH class-weighted CNN and grouped model comparison workflow</title>
<desc id="desc">Schematic scientific workflow for the same HARTH v2.0 bounded Development windows. A fixed participant-disjoint Train/Validation comparison evaluates standard versus Train-weighted temporal CNNs, and a separate three-fold participant-disjoint evaluation compares a Random Forest on statistical features with both CNN variants on raw time series. S023 and S032 are excluded. No model scores are depicted.</desc>
