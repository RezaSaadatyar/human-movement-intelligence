<g><text x="338" y="115" font-size="15" font-weight="700" fill="#173453" >Original HARTH Inputs</text><text x="338" y="145" font-size="13.2" fill="#173453" >Six sensor axes · 50 Hz</text><text x="338" y="167" font-size="13.2" fill="#173453" >100-sample label-pure windows</text><text x="338" y="189" font-size="13.2" fill="#173453" >29 Development participants</text><text x="338" y="220" font-size="11.5" fill="#173453" >14,201 matched source windows</text></g>
<g><text x="658" y="115" font-size="15" font-weight="700" fill="#173453" >Paired Experimental Design</text><text x="658" y="145" font-size="13.2" fill="#173453" >3 subject-disjoint group folds</text><text x="658" y="167" font-size="13.2" fill="#173453" >Seeds: 42 / 123 / 2026</text><text x="658" y="189" font-size="13.2" fill="#173453" >Same Development windows</text><text x="658" y="220" font-size="11.5" fill="#173453" >S023 / S032 not evaluated</text></g>
<g><text x="985" y="115" font-size="15" font-weight="700" fill="#173453" >Predeclared Loss Conditions</text><text x="985" y="145" font-size="13.2" fill="#173453" >ResNet + weighted CE / focal / CB</text><text x="985" y="167" font-size="13.2" fill="#173453" >TCN + weighted CE</text><text x="985" y="189" font-size="13.2" fill="#173453" >36 source-verified training jobs</text><text x="985" y="220" font-size="11.5" fill="#173453" >Training-only loss weights</text></g>
<g><text x="1272" y="115" font-size="14" font-weight="700" fill="#173453" >DEVELOPMENT MACRO F1</text><text x="1274" y="146" font-size="12.2" fill="#173453">ResNet · weighted CE</text><text x="1650" y="146" text-anchor="end" font-size="12.3" font-weight="700" fill="#173453">0.8286</text><text x="1274" y="167" font-size="12.2" fill="#173453">TCN · weighted CE</text><text x="1650" y="167" text-anchor="end" font-size="12.3" font-weight="400" fill="#173453">0.8105</text><text x="1274" y="188" font-size="12.2" fill="#173453">ResNet · focal loss</text><text x="1650" y="188" text-anchor="end" font-size="12.3" font-weight="400" fill="#173453">0.8058</text><text x="1274" y="209" font-size="12.2" fill="#173453">ResNet · class-balanced</text><text x="1650" y="209" text-anchor="end" font-size="12.3" font-weight="400" fill="#173453">0.7915</text><text x="1272" y="232" font-size="11.5" fill="#173453" >Descriptive Development means · no Test</text></g>
