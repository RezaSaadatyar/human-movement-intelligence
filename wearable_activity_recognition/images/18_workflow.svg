<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
<title id="title">HARTH Out-of-Fold Softmax Confidence and Error Audit</title>
<desc id="desc">Twenty-nine HARTH Development participants contribute 14201 original base-500 windows for three participant-disjoint out-of-fold evaluations using a Train-weighted temporal CNN trained for 400 optimiser steps per fold. Each source window has one original label and one held-out eight-class softmax prediction. Saved descriptive metrics include accuracy 0.9458, mean maximum softmax 0.9005, ten-bin ECE 0.0453, multiclass Brier 0.0905, and 40 incorrect windows with softmax confidence at least 0.90. Shuffling recall is 0.1233. These scores are uncalibrated, correlated within recordings and do not establish validated uncertainty or external clinical performance. Original reserved Test participants S023 and S032 are not used.</desc>
