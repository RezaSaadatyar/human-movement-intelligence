<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
  <title id="title">FINAL HARTH Research Evidence Audit and Project Closure Workflow</title>
  <desc id="desc">Dedicated FINAL notebook workflow: read saved Development, model and qualified evaluation result tables and approved research records; validate cohort and provenance integrity; compare compatible experiments; inspect calibration and rare-class limitations; export audited evidence and complete the final research quality gate. No model fitting, raw signal access or Test re-scoring.</desc>
  <defs>
    <marker id="final-arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#377396"/>
    </marker>
  </defs>
  <rect width="1700" height="480" rx="20" fill="#F4F9FD"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="36" y="42" font-size="27" font-weight="700" fill="#173453">FINAL | HARTH RESEARCH EVIDENCE AUDIT AND PROJECT CLOSURE</text>
    <text x="36" y="72" font-size="16.2" fill="#55758A">Cross-stage scientific consistency · source-file reproducibility · documented research handover</text>

    <g aria-label="Recorded evidence source groups">
      <rect x="36" y="96" width="394" height="145" rx="14" fill="#E5F1FA" stroke="#B9D4E4" stroke-width="2"/>
      <rect x="448" y="96" width="394" height="145" rx="14" fill="#E5F1FA" stroke="#B9D4E4" stroke-width="2"/>
      <rect x="860" y="96" width="394" height="145" rx="14" fill="#E5F1FA" stroke="#B9D4E4" stroke-width="2"/>
      <rect x="1272" y="96" width="392" height="145" rx="14" fill="#E0F3F0" stroke="#9FCBC5" stroke-width="2"/>
      <g font-size="17.5" font-weight="700" fill="#19435E">
        <text x="54" y="125">DEVELOPMENT COHORT</text>
        <text x="466" y="125">EXPERIMENTAL EVIDENCE</text>
        <text x="878" y="125">QUALIFIED EVALUATION</text>
        <text x="1290" y="125">REPORT AND PROVENANCE</text>
      </g>
      <g font-size="15.2" fill="#45677E">
        <text x="54" y="158">29 people · eligible task windows</text>
        <text x="54" y="182">500 / 1,000-window sampling caps</text>
        <text x="54" y="207">Participant and source integrity</text>
        <text x="466" y="158">Development model comparisons</text>
        <text x="466" y="182">Robustness across seeds and folds</text>
        <text x="466" y="207">Calibration and minority support</text>
        <text x="878" y="158">S023 and S032 · 500 windows each</text>
        <text x="878" y="182">Class metrics and participant scores</text>
        <text x="878" y="207">Same-study, not blind external</text>
        <text x="1290" y="158">Saved numerical CSV results</text>
        <text x="1290" y="182">Approved protocol and JSON record</text>
        <text x="1290" y="207">Exact input-file SHA256 checks</text>
      </g>
    </g>

    <g aria-label="Final notebook execution workflow">
