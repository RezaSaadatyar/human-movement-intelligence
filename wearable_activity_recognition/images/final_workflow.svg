        <rect x="864" y="282" width="248" height="139" rx="15" fill="#FFFFFF" stroke="#B9D2E1"/>
        <rect x="1140" y="282" width="248" height="139" rx="15" fill="#FFFFFF" stroke="#B9D2E1"/>
        <rect x="1416" y="282" width="248" height="139" rx="15" fill="#176363" stroke="#176363"/>
