<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="480" viewBox="0 0 1700 480" role="img" aria-labelledby="title desc">
  <title id="title">Stage 20: output-based research evidence consolidation</title>
  <desc id="desc">Stage 20 reads required exported CSV files from previous HARTH research stages, validates file availability, schemas, cohort consistency and metric ranges, then produces sourced research summaries, figures and a stage-specific ZIP. No notebook execution history is inspected, no models are retrained and no final-Test claims are made.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M1 1 L8 4.5 L1 8 Z" fill="#50738E"/>
    </marker>
  </defs>
  <rect width="1700" height="480" rx="18" fill="#F6FAFD"/>
  <g font-family="DejaVu Sans, Arial, sans-serif">
    <text x="44" y="55" font-size="26" font-weight="700" fill="#183B53">STAGE 20 | RESEARCH EVIDENCE CONSOLIDATION</text>
    <text x="44" y="89" font-size="16" fill="#4E6C80">Read exported research results · Validate source data · Prepare reproducible summaries</text>
    <text x="44" y="145" font-size="16" font-weight="700" fill="#254F6F">SOURCE FILES</text>
    <g stroke-width="2">
      <rect x="44" y="163" width="260" height="125" rx="13" fill="#E5F1FA" stroke="#BCD6E6"/>
      <rect x="324" y="163" width="260" height="125" rx="13" fill="#E5F1FA" stroke="#BCD6E6"/>
      <rect x="604" y="163" width="260" height="125" rx="13" fill="#E5F1FA" stroke="#BCD6E6"/>
      <rect x="884" y="163" width="260" height="125" rx="13" fill="#E5F1FA" stroke="#BCD6E6"/>
    </g>
    <g fill="#1F425E" font-size="17" font-weight="700" text-anchor="middle">
      <text x="174" y="196">Cohort summaries</text>
      <text x="454" y="196">Model results</text>
      <text x="734" y="196">Class support</text>
      <text x="1014" y="196">Calibration</text>
    </g>
    <g fill="#40627A" font-size="14" text-anchor="middle">
      <text x="174" y="226">Stages 08, 10 and 15</text>
      <text x="454" y="226">Stages 09, 13, 16 and 17</text>
      <text x="734" y="226">Stage 14</text>
      <text x="1014" y="226">Stage 19</text>
      <text x="174" y="254">Participant and window counts</text>
      <text x="454" y="254">Fold-level Macro F1</text>
      <text x="734" y="254">Sampling policy counts</text>
      <text x="1014" y="254">Out-of-fold metric means</text>
    </g>
    <path d="M1171 225 H1211" stroke="#50738E" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="1221" y="163" width="433" height="125" rx="13" fill="#E1F3F1" stroke="#8CBFB8" stroke-width="2"/>
    <text x="1437" y="193" font-size="18" font-weight="700" fill="#1B5F60" text-anchor="middle">STAGE 20 CHECKS</text>
    <g font-size="14.5" fill="#1B5F60" text-anchor="middle">
      <text x="1437" y="220">Required files and columns</text>
      <text x="1437" y="241">Participant, cohort and metric integrity</text>
      <text x="1437" y="262">Missing or invalid CSV → explicit error</text>
    </g>
    <g stroke="#8DA8BA" stroke-width="2" fill="none">
      <path d="M174 288 V324"/>
      <path d="M454 288 V324"/>
      <path d="M734 288 V324"/>
      <path d="M1014 288 V324"/>
      <path d="M174 324 H1437"/>
      <path d="M1437 288 V324"/>
      <path d="M1437 324 V347" marker-end="url(#arrow)"/>
    </g>
    <rect x="240" y="355" width="1214" height="73" rx="12" fill="#EAF1F6" stroke="#BED2DE" stroke-width="2"/>
    <text x="847" y="386" font-size="19" fill="#254F6F" text-anchor="middle" font-weight="700">Consolidated Stage 20 tables + figures + ZIP</text>
    <text x="847" y="411" font-size="14" fill="#54738A" text-anchor="middle">No notebook execution-history inspection · No model retraining · No independent final-Test claim</text>
  </g>
</svg>
