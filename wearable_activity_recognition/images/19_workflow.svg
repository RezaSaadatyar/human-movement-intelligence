 <g><text x="658" y="115" font-size="15" font-weight="700" fill="#173453">Train / Cal / Validation</text><text x="658" y="145" font-size="13.5" fill="#506C7E">Three outer subject-held-out folds</text><text x="658" y="167" font-size="13.5" fill="#506C7E">Inner Calibration: 4 people/fold</text><text x="658" y="189" font-size="13.5" fill="#506C7E">Train-only scaling; Calibration labels</text></g>
 <g><text x="985" y="115" font-size="15" font-weight="700" fill="#173453">Fold-Specific Temperature</text><text x="985" y="145" font-size="13.5" fill="#506C7E">Fitted T: 0.6322 / 0.3943 / 0.5096</text><text x="985" y="167" font-size="13.5" fill="#506C7E">Top-1 class unchanged after T</text><text x="985" y="189" font-size="13.5" fill="#506C7E">ECE improved; NLL worsened overall</text></g>
