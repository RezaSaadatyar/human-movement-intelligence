 <g aria-label="Seven matched-protocol research workflow blocks"><g class="process-block"><rect x="38" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="142" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A7E9DF">INPUT</text><text x="142" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">HARTH v2.0</text><text x="142" y="358" text-anchor="middle" font-size="12.5" fill="#DFEDF4">29 Development people</text><text x="142" y="378" text-anchor="middle" font-size="12.5" fill="#DFEDF4">Lower back + thigh</text><text x="142" y="398" text-anchor="middle" font-size="12.5" fill="#DFEDF4">Six axes · 50 Hz</text></g>
<g class="process-block"><rect x="274" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="378" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">01</text><text x="378" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Shared Windows</text><text x="378" y="358" text-anchor="middle" font-size="12.5" fill="#506C7E">14,201 bounded windows</text><text x="378" y="378" text-anchor="middle" font-size="12.5" fill="#506C7E">100 points · 2 seconds</text><text x="378" y="398" text-anchor="middle" font-size="12.5" fill="#506C7E">500 maximum per person</text></g>
<g class="process-block"><rect x="510" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="614" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">02</text><text x="614" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Fixed Dev Split</text><text x="614" y="358" text-anchor="middle" font-size="12.5" fill="#506C7E">20 Train · 6 Validation</text><text x="614" y="378" text-anchor="middle" font-size="12.5" fill="#506C7E">3 unused Dev people</text><text x="614" y="398" text-anchor="middle" font-size="12.5" fill="#506C7E">2,701 Validation rows</text></g>
<g class="process-block"><rect x="746" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="850" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">03</text><text x="850" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Compute Weights</text><text x="850" y="358" text-anchor="middle" font-size="12.5" fill="#506C7E">Eight Train class counts</text><text x="850" y="378" text-anchor="middle" font-size="12.5" fill="#506C7E">Inverse-sqrt weighting</text><text x="850" y="398" text-anchor="middle" font-size="12.5" fill="#506C7E">No Validation fitting</text></g>
<g class="process-block"><rect x="982" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="1086" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">04</text><text x="1086" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Train Two CNNs</text><text x="1086" y="358" text-anchor="middle" font-size="12.5" fill="#506C7E">Same seed and model</text><text x="1086" y="378" text-anchor="middle" font-size="12.5" fill="#506C7E">Five epochs each</text><text x="1086" y="398" text-anchor="middle" font-size="12.5" fill="#506C7E">Only loss weights differ</text></g>
<g class="process-block"><rect x="1218" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="1322" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">05</text><text x="1322" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Validation Audit</text><text x="1322" y="358" text-anchor="middle" font-size="12.5" fill="#506C7E">Standard F1: 0.6659</text><text x="1322" y="378" text-anchor="middle" font-size="12.5" fill="#506C7E">Weighted F1: 0.7968</text><text x="1322" y="398" text-anchor="middle" font-size="12.5" fill="#506C7E">Class + person checks</text></g>
<g class="process-block"><rect x="1454" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="1558" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A7E9DF">OUTPUT</text><text x="1558" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Quality Gate</text><text x="1558" y="358" text-anchor="middle" font-size="12.5" fill="#DFEDF4">Matched split confirmed</text><text x="1558" y="378" text-anchor="middle" font-size="12.5" fill="#DFEDF4">S023 / S032 excluded</text><text x="1558" y="398" text-anchor="middle" font-size="12.5" fill="#DFEDF4">Development only</text></g></g>
 <text x="30" y="465" font-size="13.1" fill="#54738A">HARTH signals → shared windows → fixed groups → Train-only loss weights → two CNN fits → Validation audits → quality gate</text>
</g>
