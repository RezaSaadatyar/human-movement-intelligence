   <path d="M77 153 L65 178 L67 193 M113 153 L125 178 L123 193" fill="none"/>
   <path d="M84 189 L80 213 L79 226 M106 189 L111 214 L112 226" fill="none"/>
   <path d="M79 226 L88 227 M112 226 L120 227" fill="none"/>
  </g>
  <rect x="86" y="171" width="18" height="11" rx="2.5" fill="#245E9D" stroke="#FFFFFF" stroke-width="1.3"/>
  <rect x="77" y="199" width="16" height="11" rx="2.5" fill="#22A0A0" stroke="#FFFFFF" stroke-width="1.3"/>
  <path d="M104 176 H140" stroke="#245E9D" stroke-width="1.5"/><text x="146" y="180" font-size="12.8" fill="#173453">Lower back</text>
  <path d="M93 204 H140" stroke="#15938F" stroke-width="1.5"/><text x="146" y="208" font-size="12.8" fill="#173453">Thigh</text>
 </g>
 <g><text x="338" y="115" font-size="15" font-weight="700" fill="#173453">Matched Development Cohort</text><text x="338" y="145" font-size="13.5" fill="#506C7E">29 Development people</text><text x="338" y="167" font-size="13.5" fill="#506C7E">14,201 windows · six axes</text><text x="338" y="189" font-size="13.5" fill="#506C7E">20 Train · 6 Val · 3 unused</text></g>
 <g><text x="658" y="115" font-size="15" font-weight="700" fill="#173453">Train-Only Class Weighting</text><text x="658" y="145" font-size="13.5" fill="#506C7E">Eight documented task classes</text><text x="658" y="167" font-size="13.5" fill="#506C7E">Inverse-sqrt from Train counts</text><text x="658" y="189" font-size="13.5" fill="#506C7E">Standard vs weighted objective</text></g>
 <g><text x="985" y="115" font-size="15" font-weight="700" fill="#173453">Identical CNN Protocol</text><text x="985" y="145" font-size="13.5" fill="#506C7E">Same model, seed and subject split</text><text x="985" y="167" font-size="13.5" fill="#506C7E">Five epochs for both variants</text><text x="985" y="189" font-size="13.5" fill="#506C7E">Only Cross-Entropy weights vary</text></g>
 <g aria-label="Observed matched last-epoch Validation Macro F1, not final Test results">
<text x="1272" y="115" font-size="14" font-weight="700" fill="#173453">VALIDATION MACRO F1</text>
<text x="1272" y="146" font-size="12.2" fill="#173453">Standard</text>
<rect x="1354" y="135" width="173.13" height="12" rx="3" fill="#245E9D"/>
<text x="1540" y="146" font-size="12.2" font-weight="700" fill="#173453">0.6659</text>
<text x="1272" y="179" font-size="12.2" fill="#173453">Weighted</text>
<rect x="1354" y="168" width="207.17" height="12" rx="3" fill="#22A0A0"/>
<text x="1574" y="179" font-size="12.2" font-weight="700" fill="#173453">0.7968</text>
<text x="1272" y="209" font-size="11.6" fill="#54738A">Same six held-out Development people</text>
<text x="1272" y="228" font-size="11.6" fill="#54738A">Single split; independent benefit not established</text>
</g>
