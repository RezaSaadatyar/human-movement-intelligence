 </g>
 <g><text x="338" y="115" font-size="15" font-weight="700" fill="#173453">Full HARTH Development Cohort</text><text x="338" y="145" font-size="13.5" fill="#506C7E">29 Development participants</text><text x="338" y="167" font-size="13.5" fill="#506C7E">S023 / S032 reserved outside audit</text><text x="338" y="189" font-size="13.5" fill="#506C7E">132,397 eligible label-pure windows</text></g>
 <g><text x="658" y="115" font-size="15" font-weight="700" fill="#173453">Deterministic Sampling Policies</text><text x="658" y="145" font-size="13.5" fill="#506C7E">Full cohort: 132,397 windows</text><text x="658" y="167" font-size="13.5" fill="#506C7E">Caps: 250 · 500 · 1,000 per person</text><text x="658" y="189" font-size="13.5" fill="#506C7E">No activity-driven sample selection</text></g>
 <g><text x="985" y="115" font-size="15" font-weight="700" fill="#173453">Activity Retention Checks</text><text x="985" y="145" font-size="13.5" fill="#506C7E">Eight documented HARTH classes</text><text x="985" y="167" font-size="13.5" fill="#506C7E">Per-class retained window fraction</text><text x="985" y="189" font-size="13.5" fill="#506C7E">Independent participant support</text></g>
