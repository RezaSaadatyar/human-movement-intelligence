<text x="1274" y="177" font-size="12.3" fill="#173453">Cap 500</text><rect x="1377" y="167" width="66.5" height="12" rx="3" fill="#245E9D"/><text x="1522" y="177" font-size="12.5" font-weight="700" fill="#173453">14,201</text>
