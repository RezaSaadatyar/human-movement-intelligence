 <g aria-label="Seven matched-protocol research workflow blocks"><g class="process-block"><rect x="38" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="142" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A7E9DF">INPUT</text><text x="142" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">HARTH v2.0</text><text x="142" y="358" text-anchor="middle" font-size="12.5" fill="#DFEDF4">29 Development people</text><text x="142" y="378" text-anchor="middle" font-size="12.5" fill="#DFEDF4">Lower back + thigh</text><text x="142" y="398" text-anchor="middle" font-size="12.5" fill="#DFEDF4">Six axes · 50 Hz</text></g>
<g class="process-block"><rect x="274" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="378" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">01</text><text x="378" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Nested Source</text><text x="378" y="358" text-anchor="middle" font-size="12.5" fill="#506C7E">14,201 base windows</text><text x="378" y="378" text-anchor="middle" font-size="12.5" fill="#506C7E">28,201 expanded windows</text><text x="378" y="398" text-anchor="middle" font-size="12.5" fill="#506C7E">Test IDs excluded</text></g>
<g class="process-block"><rect x="510" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="614" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">02</text><text x="614" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Class Audit</text><text x="614" y="358" text-anchor="middle" font-size="12.5" fill="#506C7E">Eight activity classes</text><text x="614" y="378" text-anchor="middle" font-size="12.5" fill="#506C7E">Document added windows</text><text x="614" y="398" text-anchor="middle" font-size="12.5" fill="#506C7E">Preserve source labels</text></g>
<g class="process-block"><rect x="746" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="850" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">03</text><text x="850" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">GroupKFold</text><text x="850" y="358" text-anchor="middle" font-size="12.5" fill="#506C7E">Three held-out folds</text><text x="850" y="378" text-anchor="middle" font-size="12.5" fill="#506C7E">Fixed base Validation</text><text x="850" y="398" text-anchor="middle" font-size="12.5" fill="#506C7E">No subject overlap</text></g>
<g class="process-block"><rect x="982" y="287" width="208" height="132" rx="15" fill="#FFFFFF" stroke="#B8CFDE" stroke-width="1.8"/><text x="1086" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#497992">04</text><text x="1086" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#173453">Four Conditions</text><text x="1086" y="358" text-anchor="middle" font-size="12.5" fill="#506C7E">RF 500 / RF 1000</text><text x="1086" y="378" text-anchor="middle" font-size="12.5" fill="#506C7E">Weighted CNN 500/1000</text><text x="1086" y="398" text-anchor="middle" font-size="12.5" fill="#506C7E">Fold Train only</text></g>
