<g class="process-block"><rect x="1454" y="287" width="208" height="132" rx="15" fill="#173453" stroke="#173453" stroke-width="1.8"/><text x="1558" y="310" text-anchor="middle" font-size="12.5" font-weight="700" fill="#A7E9DF">OUTPUT</text><text x="1558" y="336" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFFFF">Quality Gate</text><text x="1558" y="358" text-anchor="middle" font-size="12.5" fill="#DFEDF4">4 conditions · 3 folds</text><text x="1558" y="378" text-anchor="middle" font-size="12.5" fill="#DFEDF4">Matched source rows</text><text x="1558" y="398" text-anchor="middle" font-size="12.5" fill="#DFEDF4">No independent Test</text></g></g>
 <text x="30" y="465" font-size="13.1" fill="#54738A">Six-axis source → nested windows → label audit → group-held-out folds → matched RF and CNN fits → person/class F1 → quality gate</text>
