   <path d="M77 149 Q95 143 113 149 L116 174 Q109 187 95 189 Q81 187 74 174 Z" fill="#D9E7F1"/>
   <path d="M77 153 L65 178 L67 193 M113 153 L125 178 L123 193" fill="none"/>
   <path d="M84 189 L80 213 L79 226 M106 189 L111 214 L112 226" fill="none"/>
   <path d="M79 226 L88 227 M112 226 L120 227" fill="none"/>
  </g>
  <rect x="86" y="171" width="18" height="11" rx="2.5" fill="#245E9D" stroke="#FFFFFF" stroke-width="1.3"/>
  <rect x="77" y="199" width="16" height="11" rx="2.5" fill="#22A0A0" stroke="#FFFFFF" stroke-width="1.3"/>
  <path d="M104 176 H140" stroke="#245E9D" stroke-width="1.5"/><text x="146" y="180" font-size="12.8" fill="#173453">Lower back</text>
  <path d="M93 204 H140" stroke="#15938F" stroke-width="1.5"/><text x="146" y="208" font-size="12.8" fill="#173453">Thigh</text>
 </g>
 <g><text x="338" y="115" font-size="15" font-weight="700" fill="#173453">Nested Source Cohort</text><text x="338" y="145" font-size="13.5" fill="#506C7E">29 Development participants</text><text x="338" y="167" font-size="13.5" fill="#506C7E">14,201 base · 28,201 expanded</text><text x="338" y="189" font-size="13.5" fill="#506C7E">S023 / S032 excluded</text></g>
 <g><text x="658" y="115" font-size="15" font-weight="700" fill="#173453">Identical Fold Validation</text><text x="658" y="145" font-size="13.5" fill="#506C7E">Three participant-disjoint folds</text><text x="658" y="167" font-size="13.5" fill="#506C7E">10 / 10 / 9 people held out</text><text x="658" y="189" font-size="13.5" fill="#506C7E">Only original base-500 source rows</text></g>
 <g><text x="985" y="115" font-size="15" font-weight="700" fill="#173453">Four Matched Conditions</text><text x="985" y="145" font-size="13.5" fill="#506C7E">RF 500 vs RF 1000</text><text x="985" y="167" font-size="13.5" fill="#506C7E">Weighted CNN 500 vs 1000</text><text x="985" y="189" font-size="13.5" fill="#506C7E">Train-only scaling and weights</text></g>
 <g aria-label="Observed three-fold mean Development Macro F1 for four nested training-scale conditions"><text x="1272" y="115" font-size="14" font-weight="700" fill="#173453">3-FOLD MEAN MACRO F1</text><text x="1275" y="142" font-size="11.8" fill="#173453">RF 500</text><rect x="1376" y="132" width="103.4" height="12" rx="3" fill="#245E9D"/><text x="1521" y="142" font-size="11.8" font-weight="700" fill="#173453">0.8076</text>
<text x="1275" y="163" font-size="11.8" fill="#173453">RF 1000</text><rect x="1376" y="153" width="103.6" height="12" rx="3" fill="#4975B0"/><text x="1521" y="163" font-size="11.8" font-weight="700" fill="#173453">0.8097</text>
<text x="1275" y="184" font-size="11.8" fill="#173453">CNN 500</text><rect x="1376" y="174" width="100.3" height="12" rx="3" fill="#22A0A0"/><text x="1521" y="184" font-size="11.8" font-weight="700" fill="#173453">0.7834</text>
<text x="1275" y="205" font-size="11.8" fill="#173453">CNN 1000</text><rect x="1376" y="195" width="101.9" height="12" rx="3" fill="#64B6AA"/><text x="1521" y="205" font-size="11.8" font-weight="700" fill="#173453">0.7962</text><text x="1275" y="232" font-size="11.6" fill="#54738A">Development CV only; Test not scored</text></g>
