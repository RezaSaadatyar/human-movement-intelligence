<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="665" viewBox="0 0 1700 665" role="img" aria-labelledby="title desc">
<title id="title">HARTH bounded temporal CNN and matched Random Forest research workflow</title>
<desc id="desc">Scientific workflow for paired Development Validation on bounded, participant-disjoint HARTH acceleration windows. A temporal 1D-CNN and a statistical-feature Random Forest use identical source windows and Validation labels. The diagram is schematic, with no computed model scores.</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#245E9D"/></marker></defs>
<g font-family="DejaVu Sans, Arial, sans-serif">
<rect x="0" y="0" width="1700" height="665" rx="18" fill="#F4F9FD" stroke="#F4F9FD" stroke-width="1.6"/>
<text x="37" y="44" fill="#173453" font-size="25" font-weight="700" text-anchor="start">HARTH: TEMPORAL CNN AND MATCHED RANDOM FOREST</text>
<text x="37" y="73" fill="#54738A" font-size="15" text-anchor="start">Original six-axis acceleration windows  •  Same Development participants  •  Matched Validation comparison</text>
<rect x="25" y="96" width="1650" height="147" rx="16" fill="#EAF3FA" stroke="#C7D9E6" stroke-width="1.6"/>
<text x="45" y="123" fill="#4D738A" font-size="12" font-weight="700" text-anchor="start">SCIENTIFIC CONTEXT</text>
<rect x="43" y="138" width="393" height="88" rx="11" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="1.6"/>
<text x="58" y="161" fill="#173453" font-size="15" font-weight="700" text-anchor="start">Source data</text>
<text x="58" y="182" fill="#506C7E" font-size="13" text-anchor="start">NTNU AI Lab HARTH v2.0</text>
<text x="58" y="200" fill="#506C7E" font-size="13" text-anchor="start">Back and thigh accelerometers</text>
<text x="58" y="216" fill="#506C7E" font-size="12" text-anchor="start">Six axes at nominal 50 Hz</text>
<rect x="450" y="138" width="393" height="88" rx="11" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="1.6"/>
<text x="465" y="161" fill="#173453" font-size="15" font-weight="700" text-anchor="start">Time-safe windows</text>
<text x="465" y="182" fill="#506C7E" font-size="13" text-anchor="start">100 samples / 2 seconds</text>
<text x="465" y="200" fill="#506C7E" font-size="13" text-anchor="start">50-sample stride, pure labels</text>
<text x="465" y="216" fill="#506C7E" font-size="12" text-anchor="start">Up to 500 windows per person</text>
<rect x="857" y="138" width="393" height="88" rx="11" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="1.6"/>
<text x="872" y="161" fill="#173453" font-size="15" font-weight="700" text-anchor="start">Development partition</text>
<text x="872" y="182" fill="#506C7E" font-size="13" text-anchor="start">29 participants; grouped split</text>
<text x="872" y="200" fill="#506C7E" font-size="13" text-anchor="start">70% Train / 20% Validation</text>
<text x="872" y="216" fill="#506C7E" font-size="12" text-anchor="start">10% unused Development</text>
<rect x="1264" y="138" width="393" height="88" rx="11" fill="#FFFFFF" stroke="#D7E4ED" stroke-width="1.6"/>
<text x="1279" y="161" fill="#173453" font-size="15" font-weight="700" text-anchor="start">Comparison boundary</text>
<text x="1279" y="182" fill="#506C7E" font-size="13" text-anchor="start">Eight documented activities</text>
<text x="1279" y="200" fill="#506C7E" font-size="13" text-anchor="start">Shared source rows and labels</text>
<text x="1279" y="216" fill="#506C7E" font-size="12" text-anchor="start">S023 and S032 excluded</text>
<rect x="25" y="257" width="1650" height="311" rx="16" fill="#EEF6FB" stroke="#C7D9E6" stroke-width="1.6"/>
<text x="45" y="285" fill="#4D738A" font-size="12" font-weight="700" text-anchor="start">ANALYSIS AND MATCHED MODEL PATHS</text>
<rect x="45" y="304" width="295" height="225" rx="13" fill="#FFFFFF" stroke="#AFC9DA" stroke-width="1.6"/>
<text x="65" y="335" fill="#173453" font-size="18" font-weight="700" text-anchor="start">Raw IMU cohort</text>
<text x="65" y="367" fill="#245E9D" font-size="16" font-weight="700" text-anchor="start">N x 6 x 100</text>
<text x="65" y="396" fill="#506C7E" font-size="14" text-anchor="start">Source-aligned windows</text>
<text x="65" y="422" fill="#506C7E" font-size="14" text-anchor="start">Participant-disjoint split</text>
<text x="65" y="451" fill="#506C7E" font-size="14" text-anchor="start">Train and Validation rows</text>
<text x="65" y="478" fill="#176363" font-size="13" text-anchor="start">One window preparation pass</text>
<path d="M341 414 L396 414" stroke="#245E9D" stroke-width="2.3" fill="none" marker-end="url(#arrow)"/>
