<text x="421" y="356" fill="#173453" font-size="14" text-anchor="start">Six-axis time series -&gt; Conv1D -&gt; pooling</text>
<text x="421" y="378" fill="#506C7E" font-size="13" text-anchor="start">Train-only scaling; five epochs</text>
<rect x="400" y="426" width="438" height="103" rx="13" fill="#FFFFFF" stroke="#9BBED7" stroke-width="1.6"/>
<text x="421" y="454" fill="#245E9D" font-size="15" font-weight="700" text-anchor="start">RANDOM FOREST</text>
<text x="421" y="478" fill="#173453" font-size="14" text-anchor="start">30 statistical features -&gt; 120 trees</text>
<text x="421" y="501" fill="#506C7E" font-size="13" text-anchor="start">Class-balanced training, same Train rows</text>
<path d="M342 386 L393 352" stroke="#245E9D" stroke-width="2.3" fill="none" marker-end="url(#arrow)"/>
<path d="M342 440 L393 475" stroke="#245E9D" stroke-width="2.3" fill="none" marker-end="url(#arrow)"/>
<path d="M840 353 L908 353" stroke="#245E9D" stroke-width="2.3" fill="none" marker-end="url(#arrow)"/>
<path d="M840 475 L908 475" stroke="#245E9D" stroke-width="2.3" fill="none" marker-end="url(#arrow)"/>
<rect x="912" y="304" width="418" height="225" rx="13" fill="#FFFFFF" stroke="#AFC9DA" stroke-width="1.6"/>
<text x="934" y="335" fill="#173453" font-size="18" font-weight="700" text-anchor="start">Matched Validation</text>
<text x="934" y="367" fill="#506C7E" font-size="14" text-anchor="start">Same participant IDs</text>
<text x="934" y="394" fill="#506C7E" font-size="14" text-anchor="start">Same true activity labels</text>
<text x="934" y="421" fill="#506C7E" font-size="14" text-anchor="start">Macro F1 and balanced accuracy</text>
<text x="934" y="448" fill="#506C7E" font-size="14" text-anchor="start">Per-class F1 and confusion matrices</text>
<text x="934" y="475" fill="#176363" font-size="13" text-anchor="start">Paired participant-level differences</text>
<path d="M1332 416 L1388 416" stroke="#245E9D" stroke-width="2.3" fill="none" marker-end="url(#arrow)"/>
<rect x="1393" y="304" width="260" height="225" rx="13" fill="#176B6A" stroke="#176B6A" stroke-width="1.6"/>
<text x="1523" y="336" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">OUTPUT</text>
<text x="1523" y="372" fill="#FFFFFF" font-size="17" font-weight="700" text-anchor="middle">Research Outputs</text>
<text x="1523" y="410" fill="#FFFFFF" font-size="13" text-anchor="middle">Raw window arrays</text>
<text x="1523" y="437" fill="#FFFFFF" font-size="13" text-anchor="middle">Metrics and class tables</text>
<text x="1523" y="464" fill="#FFFFFF" font-size="13" text-anchor="middle">Evaluation figures</text>
<text x="1523" y="493" fill="#FFFFFF" font-size="13" text-anchor="middle">Model parameters</text>
<rect x="25" y="581" width="1650" height="59" rx="13" fill="#DCECEB" stroke="#B4D3D0" stroke-width="1.6"/>
<text x="47" y="605" fill="#176363" font-size="13" font-weight="700" text-anchor="start">Interpretation</text>
<text x="47" y="626" fill="#173453" font-size="13" text-anchor="start">The matched input data support a paired Development comparison; different feature representations and optimisation prevent architecture-only claims.</text>
</g></svg>
