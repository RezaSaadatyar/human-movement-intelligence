[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "human-movement-intelligence"
version = "0.1.0"
description = "Reusable Python research components for human movement and biomedical sensing"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Reza Saadatyar"}]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
pilot = ["scipy>=1.10", "scikit-learn>=1.3"]
notebooks = ["jupyterlab>=4.0", "matplotlib>=3.7", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3", "nbconvert>=7.0"]

[tool.setuptools.packages.find]
where = ["code/python/src"]
include = ["hmi*"]

[tool.setuptools.package-dir]
"" = "code/python/src"
